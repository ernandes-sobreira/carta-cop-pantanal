// ── HELPERS ────────────────────────────────────────────────────────────────
function fmt(iso){if(!iso)return'—';try{return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return'—';}}
function fmtDate(iso){if(!iso)return'—';try{return new Date(iso+'T12:00:00').toLocaleDateString('pt-BR');}catch(e){return'—';}}
function toast(m,t){const e=document.getElementById('toast');if(!e)return;e.textContent=m;e.className='toast show'+(t&&t!=='ok'?' '+t:'');setTimeout(()=>{if(e)e.className='toast';},3200);}
function setStatus(m,t){const e=document.getElementById('pill');if(e){e.textContent=m;e.className='pill '+t;}}
function addLog(a,d){if(!CURRENT_USER)return;ST.log.unshift({ts:new Date().toISOString(),user:CURRENT_USER.displayName||CURRENT_USER.email,acao:a,detalhe:d||""});if(ST.log.length>500)ST.log=ST.log.slice(0,500);}

// ── FIREBASE OPS ──────────────────────────────────────────────────────────
async function fbLoad(){
  try{
    const s = await db.ref(BASE).get();
    if(s.exists()){
      const d = s.val();
      if(d.eixos) ST.eixos = d.eixos;
      if(d.instrumento) ST.instrumento = d.instrumento;
      if(d.signatarios) ST.signatarios = d.signatarios;
      if(d.propostas) ST.propostas = d.propostas;
      if(d.log) ST.log = d.log;
    } else { await fbSave(); }
    setStatus("Firebase ativo","ok");
  } catch(e){ setStatus("Modo local","warn"); }
}
async function fbSave(){
  try{ await db.ref(BASE).set(ST); setStatus("Salvo "+new Date().toLocaleTimeString('pt-BR'),"ok"); }
  catch(e){ setStatus("Erro ao salvar","err"); }
}

// ── AUTH ──────────────────────────────────────────────────────────────────
function loginGoogle(){
  auth.signInWithPopup(provider).catch(e=>{
    toast("Erro no login: "+e.message,"err");
  });
}
function logout(){
  auth.signOut();
}
auth.onAuthStateChanged(user=>{
  CURRENT_USER = user;
  IS_ADMIN = user ? ADMINS.includes(user.email) : false;
  if(user){ fbLoad().then(()=>render()); }
  else { VIEW='publico'; render(); }
});

// ── RENDER ────────────────────────────────────────────────────────────────
function render(){
  const app = document.getElementById('app');
  if(!app) return;
  app.innerHTML = buildNav() + '<div class="main-content">' + renderView() + '</div>';
}
function renderView(){
  if(VIEW==='publico')   return renderPublico();
  if(VIEW==='instrumento') return renderInstrumento();
  if(VIEW==='clausulas') return renderClausulas();
  if(VIEW==='signatarios') return renderSignatarios();
  if(VIEW==='propostas') return renderPropostas();
  if(VIEW==='admin')     return renderAdmin();
  if(VIEW==='log')       return renderLog();
  return renderPublico();
}

function renderPropostas(){
  if(!CURRENT_USER) return semLogin();

  const outras   = (ST.propostas||[]).filter(p=>p.status!=='aberta');
  return `

function propCard(p){
  const eixo = ST.eixos.find(e=>(e.clausulas||[]).find(c=>c.id===p.clausulaId));
  const cla  = eixo&&(eixo.clausulas||[]).find(c=>c.id===p.clausulaId);
  return `<div class="prop-card prop-${p.status}">
    <div class="prop-hd">
      <div><span class="prop-user">${p.user}</span><span class="prop-ts">${fmt(p.ts)}</span><span class="prop-ref">${eixo?eixo.titulo.split('—')[0].trim():''}</span></div>

    </div>
    ${cla?`<div class="prop-orig">Cláusula original: ${cla.texto.slice(0,100)}...</div>`:''}
    <div class="prop-txt"><strong>Proposta:</strong> ${p.texto}</div>
    ${IS_ADMIN&&p.status==='aberta'?`<div class="prop-btns">
      <button class="prop-btn-ok" onclick="window.aceitarP('${p.id}')">✅ Aceitar e aplicar</button>
      <button class="prop-btn-no" onclick="window.rejeitarP('${p.id}')">❌ Rejeitar</button>
    </div>`:''}
  </div>`;
}

window.setV = function(v){ VIEW=v; render(); window.scrollTo(0,0); };
window.salvar = async function(){ addLog("Salvo","manual"); await fbSave(); toast("Salvo!"); };
window.togE = function(id){
  const b=document.getElementById('ec_'+id), t=document.getElementById('et_'+id);
  if(!b)return; const op=b.style.display!=='none';
  b.style.display=op?'none':'block'; if(t)t.textContent=op?'▼':'▲';
};
window.setStatus = async function(eid,cid,val){
  const e=ST.eixos.find(x=>x.id===eid); if(!e)return;
  const c=(e.clausulas||[]).find(x=>x.id===cid); if(!c)return;
  c.status=val; addLog("Status alterado",`→ ${val}`);
  await fbSave(); toast("Status: "+val); render();
  const b=document.getElementById('ec_'+eid); if(b)b.style.display='block';
};
window.editClausula = function(eid,cid){
  const e=ST.eixos.find(x=>x.id===eid); if(!e)return;
  const c=(e.clausulas||[]).find(x=>x.id===cid); if(!c)return;
  const nt=prompt("Editar texto:",c.texto); if(!nt||!nt.trim())return;
  c.texto=nt.trim(); addLog("Cláusula editada",nt.slice(0,60));
  fbSave().then(()=>{render(); toast("Atualizada");});
};
window.delClausula = async function(eid,cid){
  if(!confirm("Remover esta cláusula?"))return;
  const e=ST.eixos.find(x=>x.id===eid); if(!e)return;
  addLog("Cláusula removida",cid);
  e.clausulas=(e.clausulas||[]).filter(x=>x.id!==cid);
  await fbSave(); render(); toast("Removida");
};
window.addClausula = async function(eid){
  const e=ST.eixos.find(x=>x.id===eid); if(!e)return;
  const texto=prompt("Texto da nova cláusula:"); if(!texto||!texto.trim())return;
  const tipo=prompt("Tipo (obrigacao / compromisso / declaracao):")||"compromisso";
  const prior=prompt("Prioridade (urgente / alta / media):")||"alta";
  if(!e.clausulas)e.clausulas=[];
  e.clausulas.push({id:'c_'+Date.now(),tipo:tipo.trim(),texto:texto.trim(),prioridade:prior.trim(),status:'proposta'});
  addLog("Cláusula adicionada",texto.slice(0,60));
  await fbSave(); render(); toast("Adicionada!");
};
window.novaProposta = function(eid,cid){
  const texto=prompt("Sua proposta de alteração para esta cláusula:"); if(!texto||!texto.trim())return;
  if(!ST.propostas)ST.propostas=[];
  ST.propostas.unshift({id:'p_'+Date.now(),eixoId:eid,clausulaId:cid,user:CURRENT_USER.displayName||CURRENT_USER.email,ts:new Date().toISOString(),texto:texto.trim(),status:'aberta'});
  addLog("Proposta enviada",texto.slice(0,60));
  fbSave().then(()=>{render(); toast("Proposta enviada!");});
};
window.aceitarP = async function(pid){
  const p=(ST.propostas||[]).find(x=>x.id===pid); if(!p)return;
  const e=ST.eixos.find(x=>x.id===p.eixoId);
  const c=e&&(e.clausulas||[]).find(x=>x.id===p.clausulaId);
  if(c){ c.texto=p.texto; c.status='revisao'; }
  p.status='aceita'; addLog("Proposta aceita",p.texto.slice(0,60));
  await fbSave(); render(); toast("Proposta aplicada!");
};
window.rejeitarP = async function(pid){
  const p=(ST.propostas||[]).find(x=>x.id===pid); if(!p)return;
  p.status='rejeitada'; addLog("Proposta rejeitada","");
  await fbSave(); render(); toast("Rejeitada");
};
window.addSig = function(){
  const nome=prompt("Nome da instituição/pessoa:"); if(!nome||!nome.trim())return;
  const tipo=prompt("Tipo:")||"";
  const mun=prompt("Município-UF:")||"Cáceres-MT";
  const rep=prompt("Representante (opcional):")||"";
  const email=prompt("E-mail (opcional):")||"";
  ST.signatarios.push({id:'sig_'+Date.now(),nome:nome.trim(),tipo:tipo.trim(),municipio:mun.trim(),representante:rep.trim(),email:email.trim(),status:'pendente',data:''});
  addLog("Signatário adicionado",nome);
  fbSave().then(()=>{render(); toast("Adicionado!");});
};
window.confirmSig = async function(sid){
  const s=ST.signatarios.find(x=>x.id===sid); if(!s)return;
  s.status='confirmado'; s.data=new Date().toISOString().slice(0,10);
  addLog("Signatário confirmado",s.nome);
  await fbSave(); render(); toast("Confirmado!");
};
window.editSig = function(sid){
  const s=ST.signatarios.find(x=>x.id===sid); if(!s)return;
  const nn=prompt("Nome:",s.nome); if(!nn)return;
  s.nome=nn.trim();
  const nr=prompt("Representante:",s.representante||""); s.representante=(nr||"").trim();
  addLog("Signatário editado",s.nome);
  fbSave().then(()=>{render(); toast("Atualizado");});
};
window.delSig = async function(sid){
  if(!confirm("Remover signatário?"))return;
  const s=ST.signatarios.find(x=>x.id===sid);
  addLog("Signatário removido",s?s.nome:sid);
  ST.signatarios=ST.signatarios.filter(x=>x.id!==sid);
  await fbSave(); render(); toast("Removido");
};
window.enviarAdesao = async function(){
  const nome=document.getElementById('ad_nome')?.value?.trim();
  const tipo=document.getElementById('ad_tipo')?.value;
  const mun=document.getElementById('ad_municipio')?.value?.trim();
  const rep=document.getElementById('ad_rep')?.value?.trim()||"";
  const email=document.getElementById('ad_email')?.value?.trim()||"";
  if(!nome||!tipo||!mun){ toast("Preencha os campos obrigatórios","warn"); return; }
  ST.signatarios.push({id:'sig_'+Date.now(),nome,tipo,municipio:mun,representante:rep,email,status:'pendente',data:''});
  addLog("Adesão pública",nome);
  await fbSave();
  toast("Manifestação enviada! A equipe irá analisar.");
  ['ad_nome','ad_tipo','ad_municipio','ad_rep','ad_email'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
};
window.editInst = function(){
  const t=prompt("Título:",ST.instrumento.titulo); if(!t)return;
  ST.instrumento.titulo=t.trim();
  const p=prompt("Preâmbulo:",ST.instrumento.preambulo); if(p)ST.instrumento.preambulo=p.trim();
  addLog("Instrumento editado","");
  fbSave().then(()=>{render(); toast("Atualizado");});
};
window.editFund = function(){
  const atual=ST.instrumento.fundamentacao.join('\n');
  const nova=prompt("Fundamentação (uma por linha):",atual); if(!nova)return;
  ST.instrumento.fundamentacao=nova.split('\n').map(x=>x.trim()).filter(Boolean);
  addLog("Fundamentação editada","");
  fbSave().then(()=>{render(); toast("Atualizada");});
};
window.alterarStatus = function(){
  const novo=prompt("Novo status (rascunho/revisao/final):",ST.instrumento.status); if(!novo)return;
  ST.instrumento.status=novo.trim();
  addLog("Status do instrumento",novo);
  fbSave().then(()=>{render(); toast("Status: "+novo);});
};
window.gerarEstrutura = function(){
  let txt = "ESTRUTURA COP PANTANAL II\n"+"=".repeat(40)+"\n\n";
  ST.eixos.forEach(e=>{
    txt += e.titulo+"\n";
    txt += "  Auditório próprio\n  Atores sociais específicos\n  Facilitador temático\n  Relator\n  Produto: contribuição ao documento final\n\n";
  });
  txt += "PLENÁRIA DE CONVERGÊNCIA\nTodos os relatores apresentam síntese coletiva para aprovação final.";
  alert(txt);
};
window.expJSON = function(){
  const b=new Blob([JSON.stringify(ST,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='cop_pantanal_II.json'; a.click();
};
window.exportSigs = function(){
  let txt="SIGNATÁRIOS — COP PANTANAL II\n"+"=".repeat(40)+"\n\n";
  (ST.signatarios||[]).forEach(s=>{ txt+=`${s.nome}\n${s.tipo} · ${s.municipio}\nStatus: ${s.status}\n\n`; });
  const b=new Blob([txt],{type:'text/plain'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='signatarios.txt'; a.click();
};
window.resetDB = function(){
  if(!confirm("Apagar TUDO?"))return;
  if(!confirm("Tem certeza absoluta? Isso não tem volta."))return;
  db.ref(BASE).remove().then(()=>{ toast("Banco resetado","warn"); });
};

// ── INIT ──────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function(){
  render();
});
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{font-family:var(--fb);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}

/* NAV */
.top-nav{display:flex;align-items:center;gap:0;background:var(--white);border-bottom:1px solid var(--border);padding:0 20px;height:58px;position:sticky;top:0;z-index:100;box-shadow:0 1px 6px rgba(0,0,0,.06)}

.nav-links::-webkit-scrollbar{display:none}
.nav-link{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:7px;font-size:.78rem;font-weight:500;color:var(--muted);text-decoration:none;white-space:nowrap;transition:all .15s;cursor:pointer}

.nav-link.active{color:var(--green);background:var(--gl);font-weight:700}

.admin-badge{background:var(--red);color:white;font-size:.6rem;font-family:var(--fm);padding:2px 5px;border-radius:3px}

.main-content{max-width:1060px;margin:0 auto;padding:26px 20px 80px}

/* BOTÕES GERAIS */

.page-hd{margin-bottom:24px}
.ph-badge{display:inline-block;background:var(--gl);color:var(--green);font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:20px;margin-bottom:7px}

.pub-hero-lead{font-size:.9rem;opacity:.85;max-width:580px;line-height:1.75;margin-bottom:22px}

/* TIMELINE */

.pub-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}

.st-proposta{background:#9ca3af}.st-revisao{background:var(--gold)}.st-aprovada{background:var(--green)}.st-vetada{background:var(--red)}
.dc-texto{font-size:.86rem;line-height:1.75;color:#374151;text-align:justify}
.doc-sig{padding:8px 12px;background:var(--gl);border-radius:8px;margin-bottom:6px;border-left:3px solid var(--green);font-size:.85rem}
.doc-sig-meta{font-size:.75rem;color:var(--muted);margin-left:8px}
.doc-footer{border-top:1px solid var(--border);padding-top:20px;margin-top:24px;text-align:center;font-size:.82rem;color:var(--muted)}
.btn-print{background:var(--green);color:white;border:none;border-radius:9px;padding:9px 20px;font-size:.83rem;font-weight:600;cursor:pointer;font-family:var(--fb);margin-top:12px}

/* CLÁUSULAS */
.eixo-bloco{background:white;border-radius:14px;margin-bottom:10px;box-shadow:0 1px 5px rgba(0,0,0,.06);overflow:hidden}
.eixo-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;transition:background .15s;background:white}
.eixo-hd:hover{background:var(--light)}
.eh-l{display:flex;align-items:center;gap:10px}
.eh-tit{font-weight:700;font-size:.92rem}
.eh-sub{font-size:.75rem;color:var(--muted);margin-top:1px}
.eh-r{display:flex;align-items:center;gap:8px}
.tag-urg{background:#fee2e2;color:var(--red);font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:20px}
.eh-cnt{font-family:var(--fm);font-size:.82rem;font-weight:700}
.eixo-corpo{padding:0 0 10px}
.cc{margin:7px 10px;background:#fafafa;border-radius:11px;border:1.5px solid var(--border);padding:12px}
.cc:hover{border-color:#d1d5db}
.cc.aprovada{border-color:#86efac;background:#f0fdf4}
.cc.vetada{border-color:#fca5a5;background:#fef2f2;opacity:.7}
.cc-hd{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:7px}
.cc-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-family:var(--fm);font-size:.66rem;font-weight:700;flex-shrink:0}
.cc-tags{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.cc-st .st-sel{border:1.5px solid var(--border);border-radius:6px;padding:3px 6px;font-size:.73rem;font-family:var(--fb);background:white;cursor:pointer;outline:none}
.st-badge{font-size:.7rem;font-weight:600;padding:2px 7px;border-radius:5px;color:white}
.cc-btns{display:flex;gap:3px;margin-left:auto}
.ic-btn{border:none;background:none;cursor:pointer;font-size:.92rem;padding:3px 5px;border-radius:5px;transition:background .15s}
.ic-btn:hover{background:var(--light)}
.ic-btn.prop-btn{color:var(--blue)}
.cc-texto{font-size:.86rem;line-height:1.75;color:#374151}
.add-c-row{padding:4px 10px}
.btn-add-c{width:100%;background:var(--gl);color:var(--green);border:1.5px dashed var(--green);border-radius:9px;padding:8px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:var(--fb);transition:all .15s}
.btn-add-c:hover{background:var(--green);color:white}

/* SIGNATÁRIOS PRIVADO */
.sig-sec-tit{font-size:.83rem;font-weight:700;margin:18px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.sig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin-bottom:12px}
.sig-card{background:white;border-radius:13px;padding:14px;box-shadow:0 1px 5px rgba(0,0,0,.06)}
.sc-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:7px;margin-bottom:4px}
.sc-nome{font-weight:600;font-size:.86rem;line-height:1.4}
.sc-st{font-size:.63rem;font-weight:700;padding:2px 7px;border-radius:3px;color:white;text-transform:uppercase;flex-shrink:0}
.sc-tipo{font-size:.76rem;color:var(--muted);margin-bottom:3px}
.sc-meta{font-size:.73rem;color:var(--muted)}
.sc-btns{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.sc-btn{border:1.5px solid var(--border);background:white;color:var(--muted);border-radius:6px;padding:3px 9px;font-size:.73rem;cursor:pointer;font-family:var(--fb);transition:all .15s}
.sc-btn.green{border-color:var(--green);color:var(--green)}.sc-btn.green:hover{background:var(--green);color:white}
.sc-btn.red{border-color:var(--red);color:var(--red)}.sc-btn.red:hover{background:#fee2e2}
.empty-state{text-align:center;padding:28px;color:var(--muted);font-style:italic;font-size:.88rem;background:var(--light);border-radius:11px}

/* PROPOSTAS */
.prop-card{background:white;border-radius:13px;padding:14px 18px;margin-bottom:9px;box-shadow:0 1px 5px rgba(0,0,0,.06);border:1.5px solid var(--border)}
.prop-card.aberta{border-left:5px solid var(--gold)}
.prop-card.aceita{border-left:5px solid var(--green);opacity:.8}
.prop-card.rejeitada{border-left:5px solid #9ca3af;opacity:.7}
.prop-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.prop-user{font-weight:700;font-size:.8rem;color:var(--green);margin-right:8px}
.prop-ts{font-size:.7rem;color:var(--muted);margin-right:8px}
.prop-ref{font-size:.7rem;background:var(--light);padding:2px 6px;border-radius:4px;color:var(--muted)}
.prop-st{font-size:.66rem;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.05em;text-transform:uppercase}
.prop-st-aberta{background:#fef3c7;color:#854d0e}
.prop-st-aceita{background:var(--gl);color:var(--green)}
.prop-st-rejeitada{background:#f3f4f6;color:#6b7280}
.prop-orig{font-size:.76rem;color:var(--muted);padding:6px 9px;background:var(--light);border-radius:6px;margin-bottom:6px;line-height:1.5}
.prop-txt{font-size:.86rem;line-height:1.7;color:var(--text);margin-bottom:9px}
.prop-btns{display:flex;gap:7px}
.prop-btn-ok{background:var(--green);color:white;border:none;border-radius:7px;padding:6px 13px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:var(--fb)}
.prop-btn-no{background:#fee2e2;color:var(--red);border:none;border-radius:7px;padding:6px 13px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:var(--fb)}

/* ADMIN */
.admin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.admin-sec{background:white;border-radius:14px;padding:18px;box-shadow:0 1px 5px rgba(0,0,0,.06)}
.admin-sec-tit{font-family:var(--fm);font-size:.67rem;font-weight:700;letter-spacing:.1em;color:var(--green);text-transform:uppercase;margin-bottom:11px;padding-bottom:7px;border-bottom:1px solid var(--gl)}
.admin-btn{display:block;width:100%;background:var(--light);border:1.5px solid var(--border);color:var(--text);border-radius:8px;padding:8px 11px;font-size:.79rem;font-weight:500;cursor:pointer;font-family:var(--fb);text-align:left;margin-bottom:5px;transition:all .15s}
.admin-btn:hover{background:#e5e7eb}
.admin-btn.warn{background:#fef3c7;border-color:#fde68a;color:#854d0e}

/* LOG */
.log-item{background:white;border-radius:9px;padding:10px 13px;margin-bottom:6px;box-shadow:0 1px 4px rgba(0,0,0,.05);border-left:3px solid var(--green)}
.log-meta{display:flex;gap:8px;align-items:center;margin-bottom:2px}
.log-u{font-size:.7rem;font-weight:700;color:var(--green)}
.log-ts{font-size:.65rem;color:var(--muted)}
.log-a{font-size:.82rem;font-weight:500}
.log-d{font-size:.74rem;color:var(--muted);margin-top:2px;padding-left:7px;border-left:2px solid var(--border);line-height:1.5}

/* SEM LOGIN */
.sem-login{text-align:center;padding:48px 20px;background:white;border-radius:16px;box-shadow:0 1px 8px rgba(0,0,0,.07)}
.sem-login h3{font-family:var(--fd);font-size:1.3rem;margin-bottom:8px}
.sem-login p{color:var(--muted);font-size:.88rem}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:#111827;color:white;padding:9px 16px;border-radius:9px;font-size:.8rem;font-weight:500;opacity:0;transform:translateY(8px);transition:all .25s;z-index:999;pointer-events:none;font-family:var(--fb)}
.toast.show{opacity:1;transform:translateY(0)}
.toast.warn{background:#854d0e}.toast.err{background:#991b1b}

/* PRINT */
@media print{
  .top-nav,.btn-print,.cc-btns,.sc-btns,.prop-btns,.admin-btn,.btn-primary,.btn-outline,.btn-sm-edit,.login-cta,.sem-login,.adesao-card{display:none!important}
  .main-content{padding:0}
  .doc-card{box-shadow:none;border:1px solid #ccc}
}

/* MOBILE */
@media(max-width:680px){
  .top-nav{padding:0 12px}
  .nav-links .nav-link{padding:5px 8px;font-size:.73rem}
  .main-content{padding:14px 12px 60px}
  .pub-hero{padding:26px 18px}
  .pub-kpis{grid-template-columns:repeat(2,1fr)}
  .doc-card{padding:22px 14px}
  .af-row{grid-template-columns:1fr}
  .pub-prog-wrap{flex-direction:column;align-items:flex-start;gap:8px}
  .pub-inst-card{flex-direction:column}
  .login-cta{flex-direction:column;text-align:center}
  .timeline-strip{padding:12px 14px}
}
</style>

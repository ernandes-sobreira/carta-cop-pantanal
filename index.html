// ── FIREBASE ───────────────────────────────────────────────────────────────
async function fbLoad(){
  try {
    const s = await db.ref(BASE).get();
    if(s.exists()){
      const d = s.val();
      ST.eixos    = d.eixos    || JSON.parse(JSON.stringify(IE));
      ST.actions  = d.actions  || {};
      ST.comments = d.comments || {};
      ST.ticks    = d.ticks    || {};
      ST.log      = d.log      || [];
    } else { await fbSave(); }
    pill("Firebase ativo","ok");
  } catch(e){ pill("Modo local","warn"); }
}
async function fbSave(){
  try { await db.ref(BASE).set(ST); pill("Salvo "+new Date().toLocaleTimeString('pt-BR'),"ok"); }
  catch(e){ pill("Erro ao salvar","err"); }
}
function addLog(a,d){ ST.log.unshift({ts:new Date().toISOString(),acao:a,detalhe:d||""}); if(ST.log.length>400)ST.log=ST.log.slice(0,400); }
function pill(m,t){ const e=document.getElementById('pill'); if(e){e.textContent=m;e.className='pill '+t;} }
function toast(m,t){
  const e=document.getElementById('toast');
  e.textContent=m; e.className='toast show'+(t&&t!=='ok'?' '+t:'');
  setTimeout(()=>{ e.className='toast'; },3000);
}
function fmt(iso){ try{ return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){return'';} }

// ── RENDER PRINCIPAL ───────────────────────────────────────────────────────
function render(){
  const app = document.getElementById('app');
  if(!app) return;
  app.innerHTML = buildNav() + '<div class="main">' + buildView() + '</div>';
}
function buildView(){
  if(VIEW==='publico')   return viewPublico();
  if(VIEW==='eixos')     return viewEixos();
  if(VIEW==='juridico')  return viewJuridico();
  if(VIEW==='carta')     return viewCarta();
  if(VIEW==='log')       return viewLog();
  return viewPublico();
}

function viewEixos(){

  const ticked = ST.eixos.reduce((a,e)=>a+e.demandas.filter(d=>ST.ticks[d.id]).length,0);
  const pct    = total>0?Math.round(ticked/total*100):0;

  <div class="page-hd">
    <div class="ph-tag">Gestão interna da equipe</div>

  </div>
  ${ST.eixos.map(e=>buildEixo(e)).join('')}`;

function buildEixo(e){
  const tck = e.demandas.filter(d=>ST.ticks[d.id]).length;
  const tot = e.demandas.length;
  const pct = tot>0?Math.round(tck/tot*100):0;
  const nac = e.demandas.filter(d=>ST.actions[d.id]&&ST.actions[d.id].acao).length;
  const ncm = e.demandas.reduce((a,d)=>a+(ST.comments[d.id]?ST.comments[d.id].length:0),0);
  return `<div class="eixo" id="eixo_${e.id}">
  <div class="eixo-hd" onclick="togE('${e.id}')" style="border-left:6px solid ${e.cor}">
    <div class="eixo-hd-l">
      <span class="eixo-icon">${e.icon}</span>
      <div><div class="eixo-tit">${e.titulo}</div><div class="eixo-sub">${e.sub}</div></div>
    </div>
    <div class="eixo-hd-r">
      ${nac>0?`<span class="tag-ac">💡${nac}</span>`:''}
      ${ncm>0?`<span class="tag-cm">💬${ncm}</span>`:''}
      <div class="mini-bar"><div class="mini-fill" style="width:${pct}%;background:${e.cor}"></div></div>
      <span class="eixo-pct" style="color:${e.cor}">${pct}%</span>
      <span class="eixo-cnt">${tck}/${tot}</span>
      <span id="tog_${e.id}">▼</span>
    </div>
  </div>
  <div class="eixo-body" id="eb_${e.id}" style="display:none">
    <div class="eixo-desc" style="border-left:4px solid ${e.cor}">${e.descricao}</div>
    ${e.demandas.map(d=>buildDemanda(d,e.cor)).join('')}
    <div class="add-d-row">
      <input id="nd_${e.id}" class="nd-inp" placeholder="Adicionar nova demanda...">
      <button class="btn-add-d" style="background:${e.cor}" onclick="window.addD('${e.id}')">+ Adicionar</button>
    </div>
  </div>
</div>`;
}

function buildDemanda(d, cor){
  const ticked = ST.ticks[d.id];
  const ac = ST.actions[d.id]||{};

  const expA = window._expA&&window._expA[d.id];

  const ST_OPTS = ["Proposta","Em andamento","Concluída","Pausada","Cancelada"];
  const GRUPOS  = ["Povos Tradicionais","Comunidade Científica","Juventude","Educadores","Gestores Públicos","Mulheres Pantaneiras","Setor Produtivo","Sociedade Civil","Todos"];
  return `<div class="dem ${ticked?'ticked':''}" id="dem_${d.id}">
  <div class="dem-top">
    <button class="tick-btn ${ticked?'on':''}" onclick="window.togTick('${d.id}')" style="${ticked?'background:'+cor+';border-color:'+cor:''}">${ticked?'✓':''}</button>

    <p class="dem-txt">${d.texto}</p>
    <div class="dem-btns">
      <button class="dem-btn" onclick="window.togA('${d.id}')" style="color:${cor}">💡 Ação</button>
      <button class="dem-btn" onclick="window.togC('${d.id}')" style="color:#0d5c8f">💬 ${cms.length>0?cms.length:''}</button>
      <button class="dem-btn" onclick="window.editD('${d.id}')">✏️</button>
      <button class="dem-btn red" onclick="window.delD('${d.id}')">🗑️</button>
    </div>
  </div>

  ${expA?`<div class="ap-panel" style="border-top:3px solid ${cor}20">
    <div class="ap-tit" style="color:${cor}">💡 Plano de Ação</div>
    <div class="ap-grid">
      <div class="ap-field ap-wide"><label>O que será feito</label>
        <textarea id="ap_acao_${d.id}" class="ap-ta" rows="2">${ac.acao||''}</textarea></div>
      <div class="ap-field"><label>Status</label>
        <select id="ap_status_${d.id}" class="ap-sel">
          ${ST_OPTS.map(s=>`<option${ac.status===s?' selected':''}>${s}</option>`).join('')}
        </select></div>
      <div class="ap-field"><label>Data prevista</label>
        <input id="ap_data_${d.id}" class="ap-inp" type="date" value="${ac.data||''}"></div>
      <div class="ap-field"><label>Responsável</label>
        <input id="ap_resp_${d.id}" class="ap-inp" placeholder="Nome" value="${ac.responsavel||''}"></div>
      <div class="ap-field"><label>Grupo-alvo</label>
        <select id="ap_grupo_${d.id}" class="ap-sel">
          ${GRUPOS.map(g=>`<option${ac.grupo===g?' selected':''}>${g}</option>`).join('')}
        </select></div>
      <div class="ap-field ap-wide"><label>Notas</label>
        <textarea id="ap_notas_${d.id}" class="ap-ta" rows="2">${ac.notas||''}</textarea></div>
    </div>
    <div class="ap-btns">
      <button class="ap-save" style="background:${cor}" onclick="window.saveAction('${d.id}')">💾 Salvar plano</button>
      <button class="ap-clear" onclick="window.clearAction('${d.id}')">Limpar</button>
    </div>
  </div>`:''}

  ${expC?`<div class="coms-panel">
    <div class="coms-tit">💬 Manifestações e propostas</div>
    ${cms.length===0?'<div class="coms-empty">Nenhuma manifestação ainda.</div>':''}
    ${cms.map((c,i)=>`<div class="com-item">
      <div class="com-meta"><span class="com-ts">${fmt(c.ts)}</span>
        <button class="com-del" onclick="window.delCom('${d.id}',${i})">✕</button></div>
      <div class="com-txt">${c.texto}</div>
    </div>`).join('')}
    <div class="com-inp-row">
      <textarea id="ci_${d.id}" class="com-ta" rows="2" placeholder="Escreva uma manifestação ou proposta..."></textarea>
      <button class="com-send" style="background:${cor}" onclick="window.addCom('${d.id}')">Enviar</button>
    </div>
  </div>`:''}
</div>`;
}

    <p class="ph-sub">A Carta do Pantanal hoje tem força moral e política. Veja os caminhos para dar a ela força jurídica real.</p>
  </div>

  <div class="jur-status-card">
    <div class="jur-status-icon">📄</div>
    <div>
      <div class="jur-status-tit">Status atual da Carta</div>
      <div class="jur-status-txt"><strong>Manifesto político coletivo</strong> — construído por 500+ pessoas em novembro de 2025, com 5 eixos, 11 demandas formais e 6 compromissos coletivos. Tem força simbólica e legitimidade social, mas ainda não tem força jurídica vinculante.</div>
    </div>
  </div>

  <div class="sec-tit" style="margin-top:28px">4 Caminhos para Formalização</div>

  <div class="jur-caminhos">

    <div class="jur-card">
      <div class="jur-num">01</div>
      <div class="jur-body">
        <div class="jur-tit">📋 Protocolo de Adesão Institucional</div>
        <div class="jur-nivel">Nível: Institucional · Complexidade: Baixa · Prazo: 1–3 meses</div>
        <p class="jur-desc">Instituições (prefeituras, universidades, ONGs, associações) assinam formalmente um documento declarando adesão aos princípios da Carta. Não é lei, mas cria responsabilização pública e base para cobranças políticas.</p>
        <div class="jur-passos-tit">Como fazer:</div>
        <ol class="jur-passos">
          <li>Elaborar o texto do protocolo com base nos 5 eixos da Carta</li>
          <li>Convidar instituições para cerimônia de assinatura na COP II</li>
          <li>Registrar as adesões em cartório para dar publicidade formal</li>
          <li>Publicar lista de signatários no site e nas redes sociais</li>
          <li>Criar mecanismo de acompanhamento público das obrigações assumidas</li>
        </ol>
        <div class="jur-base">Base legal: autonomia institucional, publicidade dos atos públicos.</div>
      </div>
    </div>

    <div class="jur-card">
      <div class="jur-num">02</div>
      <div class="jur-body">
        <div class="jur-tit">🏛️ Decreto ou Resolução Municipal/Estadual</div>
        <div class="jur-nivel">Nível: Legislativo · Complexidade: Média · Prazo: 3–12 meses</div>
        <p class="jur-desc">Apresentar a Carta à Câmara Municipal de Cáceres e/ou à ALMT como base para um decreto ou resolução que reconheça os princípios da Carta como política pública municipal ou estadual.</p>
        <div class="jur-passos-tit">Como fazer:</div>
        <ol class="jur-passos">
          <li>Redigir projeto de lei ou decreto com suporte técnico da UNEMAT</li>
          <li>Mapear vereadores e deputados aliados ao tema ambiental</li>
          <li>Apresentar formalmente à Câmara de Cáceres e/ou ALMT</li>
          <li>Realizar audiência pública com comunidades e pesquisadores</li>
          <li>Acompanhar tramitação e mobilizar apoio popular</li>
          <li>Celebrar aprovação como marco da COP Pantanal na mídia regional</li>
        </ol>
        <div class="jur-base">Base legal: Lei Orgânica Municipal, Constituição Estadual MT Art. 262 (meio ambiente).</div>
      </div>
    </div>

    <div class="jur-card">
      <div class="jur-num">03</div>
      <div class="jur-body">
        <div class="jur-tit">📊 Plano de Ação Territorial com Indicadores</div>
        <div class="jur-nivel">Nível: Técnico-financeiro · Complexidade: Alta · Prazo: 6–18 meses</div>
        <p class="jur-desc">Reformatar a Carta como um Plano de Ação Territorial com metas, indicadores, responsáveis e cronograma. Isso abre portas para captação de recursos junto a UNESCO, MMA, fundos climáticos internacionais e editais de pesquisa.</p>
        <div class="jur-passos-tit">Como fazer:</div>
        <ol class="jur-passos">
          <li>Converter cada demanda da Carta em meta SMART (específica, mensurável, atingível, relevante, temporal)</li>
          <li>Associar indicadores de monitoramento a cada eixo</li>
          <li>Definir responsáveis institucionais por eixo (UNEMAT, Prefeituras, ONGs)</li>
          <li>Elaborar orçamento estimado e fontes de financiamento</li>
          <li>Submeter ao MMA, UNESCO e fundos climáticos como proposta</li>
          <li>Integrar ao PLAC (Plano Local de Ação Climática) de Cáceres</li>
        </ol>
        <div class="jur-base">Base legal: Lei 14.119/2021 (PSA), Política Nacional sobre Mudança do Clima, Decreto 9.578/2018.</div>
      </div>
    </div>

    <div class="jur-card">
      <div class="jur-num">04</div>
      <div class="jur-body">
        <div class="jur-tit">🌍 Termo de Compromisso Multilateral</div>
        <div class="jur-nivel">Nível: Internacional · Complexidade: Alta · Prazo: 12–24 meses</div>
        <p class="jur-desc">Modelo inspirado nos acordos de cidades climáticas (Pacto de Amsterdã, Pacto de Milão). Partes signatárias — municípios, estados, universidades, organizações internacionais — assumem obrigações com prazo e monitoramento externo.</p>
        <div class="jur-passos-tit">Como fazer:</div>
        <ol class="jur-passos">
          <li>Redigir o Termo com cláusulas por eixo, tipificando obrigações, compromissos e declarações</li>
          <li>Submeter a juristas especializados em direito ambiental para revisão</li>
          <li>Apresentar na COP II para assinatura pública dos primeiros signatários</li>
          <li>Encaminhar ao Comitê da Bacia do Rio Paraguai para endosso</li>
          <li>Apresentar na COP 30 em Belém como instrumento modelo para biomas brasileiros</li>
          <li>Buscar reconhecimento pela UNESCO e PNUMA</li>
        </ol>
        <div class="jur-base">Base legal: Convenção 169 OIT, Acordo de Paris Art.7, Agenda 2030 ODS 15 e 16.</div>
      </div>
    </div>
  </div>

  <div class="jur-recomendacao">
    <div class="jr-tit">🎯 Recomendação para a COP Pantanal II</div>
    <div class="jr-txt">
      <p>O caminho mais estratégico para 2026 é <strong>combinar os caminhos 01 e 02 em paralelo</strong>:</p>
      <ul>
        <li>Durante a COP II: realizar a <strong>cerimônia pública de assinatura do Protocolo de Adesão</strong> com todas as instituições presentes — isso cria um fato político e midiático imediato.</li>
        <li>Simultaneamente: iniciar a articulação com vereadores de Cáceres e deputados estaduais para o <strong>projeto de decreto municipal</strong> — a UNEMAT pode dar suporte técnico.</li>
        <li>A médio prazo: desenvolver o <strong>Plano de Ação Territorial</strong> integrando com o PLAC de Cáceres e submeter a editais climáticos nacionais e internacionais.</li>
      </ul>
    </div>
  </div>

  <div class="jur-proximos">
    <div class="jp-tit">📌 Próximos passos concretos</div>
    <div class="jp-lista">
      <div class="jp-item"><span class="jp-n">1</span><div><strong>Nomear um responsável jurídico</strong> — identificar advogado ou grupo de direito ambiental parceiro (OAB-MT, clínicas jurídicas da UFMT)</div></div>
      <div class="jp-item"><span class="jp-n">2</span><div><strong>Definir qual caminho priorizar</strong> — equipe decide entre Protocolo, Decreto ou Termo Multilateral como foco da COP II</div></div>
      <div class="jp-item"><span class="jp-n">3</span><div><strong>Elaborar minuta base</strong> — texto jurídico inicial com base nos 5 eixos da Carta, para ser ajustado com especialistas</div></div>
      <div class="jp-item"><span class="jp-n">4</span><div><strong>Mapear signatários estratégicos</strong> — quais prefeituras, universidades e organizações devem ser priorizadas para adesão</div></div>
      <div class="jp-item"><span class="jp-n">5</span><div><strong>Inserir na agenda da COP II</strong> — criar espaço formal de assinatura e apresentação pública do instrumento</div></div>
    </div>
  </div>`;
}

        <li>Estabelecimento de parcerias com organizações globais comprometidas com impacto positivo real;</li>

function viewLog(){
  if(!LOGADO) return semAcesso();
  return `
  <div class="page-hd">
    <div class="ph-tag">Auditoria</div>
    <h2 class="ph-tit">📝 Registro de Ações</h2>
    <p class="ph-sub">${ST.log.length} entradas registradas</p>
  </div>
  ${ST.log.length===0?'<div class="empty">Nenhuma ação registrada ainda.</div>':
    ST.log.map(l=>`<div class="log-item">
      <div class="log-meta"><span class="log-ts">${fmt(l.ts)}</span></div>
      <div class="log-a">${l.acao}</div>
      ${l.detalhe?`<div class="log-d">${l.detalhe}</div>`:''}
    </div>`).join('')}`;
}

  return `<div class="sem-acesso">

// ── LOGIN MODAL ────────────────────────────────────────────────────────────
window.abrirLogin = function(){
  const modal = document.createElement('div');
  modal.id = 'modal-login';
  modal.className = 'modal-overlay';
  modal.innerHTML = `<div class="modal-card">
    <div class="modal-icon">🌿</div>
    <h3 class="modal-tit">Acesso da Equipe</h3>
    <p class="modal-sub">COP Pantanal II · Grupo de Ação</p>
    <input id="senha-inp" type="password" class="modal-inp" placeholder="Senha de acesso" onkeydown="if(event.key==='Enter')window.tentarLogin()">
    <button class="modal-btn" onclick="window.tentarLogin()">Entrar</button>
    <button class="modal-cancel" onclick="document.getElementById('modal-login').remove()">Cancelar</button>
  </div>`;
  document.body.appendChild(modal);
  setTimeout(()=>{ const el=document.getElementById('senha-inp'); if(el)el.focus(); },100);
};
window.tentarLogin = function(){
  const v = document.getElementById('senha-inp')?.value;
  if(v===SENHA){
    LOGADO=true;
    document.getElementById('modal-login')?.remove();
    fbLoad().then(()=>{ VIEW='eixos'; render(); toast("Bem-vinda, equipe!"); });
  } else {
    toast("Senha incorreta","err");
  }
};
window.fazerLogout = function(){
  LOGADO=false; VIEW='publico'; render();
};

// ── ACTIONS ────────────────────────────────────────────────────────────────
window.sv = function(v){ VIEW=v; render(); window.scrollTo(0,0); };
window.salvar = async function(){ addLog("Salvamento manual",""); await fbSave(); toast("Salvo no Firebase!"); };

window.togE = function(id){
  const b=document.getElementById('eb_'+id), t=document.getElementById('tog_'+id);
  if(!b)return; const op=b.style.display!=='none';
  b.style.display=op?'none':'block'; if(t)t.textContent=op?'▼':'▲';
};
window.togTick = async function(did){
  ST.ticks[did]=!ST.ticks[did];
  const e=ST.eixos.find(e=>e.demandas.find(d=>d.id===did));
  const d=e&&e.demandas.find(d=>d.id===did);
  addLog(ST.ticks[did]?"Marcada":"Desmarcada", d?d.texto.slice(0,70):did);
  await fbSave(); render();
  if(e){ const b=document.getElementById('eb_'+e.id); if(b)b.style.display='block'; }
};
window.togA = function(did){
  window._expA=window._expA||{}; window._expA[did]=!window._expA[did];
  render();
  const e=ST.eixos.find(e=>e.demandas.find(d=>d.id===did));
  if(e){ const b=document.getElementById('eb_'+e.id); if(b)b.style.display='block'; }
};
window.togC = function(did){
  window._expC=window._expC||{}; window._expC[did]=!window._expC[did];
  render();
  const e=ST.eixos.find(e=>e.demandas.find(d=>d.id===did));
  if(e){ const b=document.getElementById('eb_'+e.id); if(b)b.style.display='block'; }
};
window.saveAction = async function(did){
  if(!ST.actions[did])ST.actions[did]={};
  const g=id=>document.getElementById(id);
  ST.actions[did]={
    acao:    g('ap_acao_'+did)?.value||'',
    status:  g('ap_status_'+did)?.value||'Proposta',
    data:    g('ap_data_'+did)?.value||'',
    responsavel: g('ap_resp_'+did)?.value||'',
    grupo:   g('ap_grupo_'+did)?.value||'',
    notas:   g('ap_notas_'+did)?.value||''
  };
  const e=ST.eixos.find(e=>e.demandas.find(d=>d.id===did));
  const d=e&&e.demandas.find(d=>d.id===did);
  addLog("Plano de ação salvo", d?d.texto.slice(0,60):did);
  await fbSave(); toast("Plano salvo!");
  window._expA=window._expA||{}; window._expA[did]=true;
  render();
  if(e){ const b=document.getElementById('eb_'+e.id); if(b)b.style.display='block'; }
};
window.clearAction = async function(did){
  if(!confirm("Limpar o plano de ação?"))return;
  ST.actions[did]={acao:'',data:'',responsavel:'',grupo:'',status:'Proposta',notas:''};
  addLog("Plano limpo",did); await fbSave(); render();
  const e=ST.eixos.find(e=>e.demandas.find(d=>d.id===did));
  if(e){ const b=document.getElementById('eb_'+e.id); if(b)b.style.display='block'; }
};
window.addCom = async function(did){
  const inp=document.getElementById('ci_'+did);
  if(!inp||!inp.value.trim()){toast("Digite algo","warn");return;}
  if(!ST.comments[did])ST.comments[did]=[];
  ST.comments[did].push({ts:new Date().toISOString(),texto:inp.value.trim()});
  addLog("Manifestação",inp.value.slice(0,60));
  await fbSave(); window._expC=window._expC||{}; window._expC[did]=true;
  toast("Manifestação enviada!"); render();
  const e=ST.eixos.find(e=>e.demandas.find(d=>d.id===did));
  if(e){ const b=document.getElementById('eb_'+e.id); if(b)b.style.display='block'; }
};
window.delCom = async function(did,i){
  if(!confirm("Remover?"))return;
  ST.comments[did].splice(i,1); addLog("Manifestação removida","");
  await fbSave(); window._expC=window._expC||{}; window._expC[did]=true;
  render();
  const e=ST.eixos.find(e=>e.demandas.find(d=>d.id===did));
  if(e){ const b=document.getElementById('eb_'+e.id); if(b)b.style.display='block'; }
};
window.editD = function(did){
  const e=ST.eixos.find(e=>e.demandas.find(d=>d.id===did)); if(!e)return;
  const d=e.demandas.find(d=>d.id===did);
  const nt=prompt("Editar demanda:",d.texto); if(!nt||!nt.trim())return;
  d.texto=nt.trim(); addLog("Demanda editada",nt.slice(0,60));
  fbSave().then(()=>{ toast("Atualizada"); render();
    const b=document.getElementById('eb_'+e.id); if(b)b.style.display='block'; });
};
window.delD = async function(did){
  if(!confirm("Remover esta demanda?"))return;
  const e=ST.eixos.find(e=>e.demandas.find(d=>d.id===did)); if(!e)return;
  const d=e.demandas.find(d=>d.id===did);
  addLog("Demanda removida",d.texto.slice(0,60));
  e.demandas=e.demandas.filter(d=>d.id!==did);
  delete ST.ticks[did]; delete ST.comments[did]; delete ST.actions[did];
  await fbSave(); toast("Removida"); render();
  const b=document.getElementById('eb_'+e.id); if(b)b.style.display='block';
};
window.addD = async function(eid){
  const inp=document.getElementById('nd_'+eid); if(!inp||!inp.value.trim()){toast("Digite o texto","warn");return;}
  const e=ST.eixos.find(e=>e.id===eid); if(!e)return;
  e.demandas.push({id:'d_'+Date.now(),n:'',texto:inp.value.trim()});
  addLog("Nova demanda",inp.value.slice(0,60));
  await fbSave(); inp.value=''; toast("Demanda adicionada!"); render();
  const b=document.getElementById('eb_'+eid); if(b)b.style.display='block';
};

document.addEventListener('DOMContentLoaded', function(){ render(); });
</script>

/* LAYOUT */
.main{max-width:1020px;margin:0 auto;padding:24px 18px 80px}

/* HERO */
.hero{background:linear-gradient(135deg,#072b13,#1a6b2e 55%,#1f7234);border-radius:18px;padding:42px 38px;color:white;margin-bottom:22px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-80px;right:-80px;width:280px;height:280px;background:rgba(255,255,255,.04);border-radius:50%}
.hero-tag{font-size:.7rem;font-family:var(--fm);letter-spacing:.1em;opacity:.8;margin-bottom:12px}
.hero-h1{font-family:var(--fd);font-size:clamp(1.7rem,4vw,2.6rem);font-weight:700;line-height:1.05;margin-bottom:12px}
.hero-h1 em{color:#9ef0b4;font-style:italic}
.hero-lead{font-size:.88rem;opacity:.85;max-width:560px;line-height:1.75}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:18px}
.kpi{background:var(--wh);border-radius:12px;padding:15px;text-align:center;border-top:4px solid var(--kc,#1a6b2e);box-shadow:0 1px 5px rgba(0,0,0,.06)}
.kpi-v{font-family:var(--fd);font-size:2rem;font-weight:700;color:var(--kc,#1a6b2e);line-height:1}
.kpi-l{font-size:.7rem;color:var(--mu);margin-top:4px;font-weight:500}

/* PROGRESSO GERAL */
.prog-geral{background:var(--wh);border-radius:12px;padding:14px 18px;margin-bottom:20px;box-shadow:0 1px 5px rgba(0,0,0,.06);display:flex;align-items:center;gap:12px}
.pg-label{font-size:.78rem;font-weight:600;min-width:220px}
.pg-track{flex:1;height:10px;background:var(--li);border-radius:5px;overflow:hidden}
.pg-fill{height:100%;background:linear-gradient(90deg,var(--g),#3aab6b);border-radius:5px;transition:width .6s}
.pg-pct{font-family:var(--fm);font-size:.74rem;color:var(--mu);min-width:36px;text-align:right}

/* SEÇÃO */
.sec-tit{font-family:var(--fd);font-size:1.2rem;font-weight:700;margin-bottom:12px}

/* EIXOS PÚBLICO */
.ep{display:flex;align-items:center;gap:11px;background:var(--wh);border-radius:11px;padding:12px 15px;margin-bottom:9px;box-shadow:0 1px 4px rgba(0,0,0,.06);border-left:5px solid var(--ec)}
.ep-icon{font-size:1.3rem;flex-shrink:0}
.ep-body{flex:1}
.ep-tit{font-weight:600;font-size:.85rem;margin-bottom:2px}
.ep-sub{font-size:.74rem;color:var(--mu);margin-bottom:5px}
.ep-bar-row{display:flex;align-items:center;gap:8px}
.ep-track{flex:1;height:7px;background:var(--li);border-radius:4px;overflow:hidden}
.ep-fill{height:100%;border-radius:4px;transition:width .5s}
.ep-pct{font-family:var(--fm);font-size:.7rem;min-width:28px}
.ep-ac{font-size:.73rem;color:var(--go);margin-top:4px}
.ep-cnt{font-family:var(--fm);font-size:.82rem;font-weight:700;flex-shrink:0}

/* TIMELINE */
.timeline{display:flex;align-items:center;background:var(--wh);border-radius:13px;padding:16px 22px;margin-top:8px;box-shadow:0 1px 5px rgba(0,0,0,.06);overflow-x:auto;gap:0}
.tli{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:90px}
.tl-dot{width:13px;height:13px;border-radius:50%;background:var(--bd);border:2px solid var(--bd)}
.tl-dot.done{background:var(--g);border-color:var(--g)}
.tl-dot.active{background:var(--go);border-color:var(--go);box-shadow:0 0 0 4px #fef3c7}
.tl-txt{text-align:center}.tl-txt strong{display:block;font-size:.73rem;font-weight:700}
.tl-txt span{font-size:.65rem;color:var(--mu)}
.tli.done .tl-txt strong{color:var(--g)}
.tli.active .tl-txt strong{color:var(--go)}
.tl-line{flex:1;height:2px;background:var(--bd);min-width:24px}
.tl-line.done{background:var(--g)}
.login-hint{display:flex;align-items:center;gap:12px;background:#fef9c3;border-radius:11px;padding:13px 16px;margin-top:22px;font-size:.82rem;border-left:4px solid var(--go);color:#854d0e}

/* PAGE HEADER */
.page-hd{margin-bottom:22px}
.ph-tag{display:inline-block;background:var(--gl);color:var(--g);font-size:.67rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:20px;margin-bottom:7px}
.ph-tit{font-family:var(--fd);font-size:1.8rem;font-weight:700;margin-bottom:4px}
.ph-sub{color:var(--mu);font-size:.86rem}

/* EIXOS PRIVADOS */
.eixo{background:var(--wh);border-radius:14px;margin-bottom:10px;box-shadow:0 1px 5px rgba(0,0,0,.06);overflow:hidden}
.eixo-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;transition:background .15s}
.eixo-hd:hover{background:var(--li)}
.eixo-hd-l{display:flex;align-items:center;gap:10px}
.eixo-icon{font-size:1.3rem}
.eixo-tit{font-weight:700;font-size:.9rem}
.eixo-sub{font-size:.73rem;color:var(--mu)}
.eixo-hd-r{display:flex;align-items:center;gap:7px}
.tag-ac{background:#fef3c7;color:#854d0e;font-size:.67rem;font-weight:700;padding:2px 6px;border-radius:20px}
.tag-cm{background:#dbeafe;color:var(--b);font-size:.67rem;font-weight:700;padding:2px 6px;border-radius:20px}
.mini-bar{width:56px;height:6px;background:var(--li);border-radius:3px;overflow:hidden}
.mini-fill{height:100%;border-radius:3px;transition:width .4s}
.eixo-pct{font-family:var(--fm);font-size:.72rem;font-weight:700}
.eixo-cnt{font-size:.75rem;color:var(--mu)}
.eixo-body{padding:0 0 10px}
.eixo-desc{font-size:.82rem;color:#374151;line-height:1.7;margin:10px 12px;padding:10px 12px;background:var(--li);border-radius:0 8px 8px 0}

/* DEMANDA */
.dem{margin:7px 10px;background:#fafafa;border-radius:11px;border:1.5px solid var(--bd);transition:all .2s}
.dem.ticked{border-color:#86efac;background:#f0fdf4}
.dem-top{display:flex;align-items:flex-start;gap:9px;padding:11px 12px}
.tick-btn{width:24px;height:24px;border-radius:50%;border:2px solid var(--bd);background:var(--wh);cursor:pointer;font-size:.8rem;color:white;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;transition:all .15s}
.dem-n{font-family:var(--fm);font-size:.68rem;font-weight:700;flex-shrink:0;padding-top:3px;min-width:28px}
.dem-txt{flex:1;font-size:.86rem;line-height:1.7;color:#374151}
.dem-btns{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.dem-btn{border:1.5px solid var(--bd);background:var(--wh);border-radius:6px;padding:3px 7px;font-size:.72rem;cursor:pointer;font-family:var(--fb);font-weight:500;white-space:nowrap;transition:all .15s}
.dem-btn:hover{background:var(--li)}
.dem-btn.red{color:var(--r);border-color:var(--r)}.dem-btn.red:hover{background:#fee2e2}
.add-d-row{display:flex;gap:8px;padding:6px 12px}
.nd-inp{flex:1;border:1.5px solid var(--bd);border-radius:8px;padding:7px 10px;font-size:.82rem;font-family:var(--fb);outline:none}
.nd-inp:focus{border-color:var(--g)}
.btn-add-d{border:none;color:white;border-radius:8px;padding:7px 13px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:var(--fb);white-space:nowrap}

/* PLANO DE AÇÃO */
.ap-panel{padding:12px 14px;background:#fffdf0}
.ap-tit{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.ap-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ap-wide{grid-column:1/-1}
.ap-field{display:flex;flex-direction:column;gap:3px}
.ap-field label{font-size:.68rem;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:.06em}
.ap-ta{border:1.5px solid var(--bd);border-radius:7px;padding:7px 9px;font-size:.8rem;font-family:var(--fb);resize:vertical;outline:none;background:var(--wh)}
.ap-ta:focus{border-color:var(--g)}
.ap-inp{border:1.5px solid var(--bd);border-radius:7px;padding:7px 9px;font-size:.8rem;font-family:var(--fb);outline:none;background:var(--wh)}
.ap-inp:focus{border-color:var(--g)}
.ap-sel{border:1.5px solid var(--bd);border-radius:7px;padding:7px 9px;font-size:.8rem;font-family:var(--fb);background:var(--wh);cursor:pointer;outline:none}
.ap-btns{display:flex;gap:7px;margin-top:10px;padding-top:9px;border-top:1px solid #fde68a}
.ap-save{border:none;color:white;border-radius:7px;padding:7px 13px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:var(--fb)}
.ap-clear{border:1.5px solid var(--bd);background:var(--wh);color:var(--mu);border-radius:7px;padding:6px 11px;font-size:.74rem;cursor:pointer;font-family:var(--fb)}

/* COMENTÁRIOS */
.coms-panel{background:#f0f7ff;border-top:1px solid #bfdbfe;padding:12px 14px}
.coms-tit{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--b);margin-bottom:9px}
.coms-empty{font-size:.76rem;color:var(--mu);font-style:italic;margin-bottom:8px}
.com-item{background:var(--wh);border-radius:7px;padding:8px 10px;margin-bottom:6px;border:1px solid #dbeafe}
.com-meta{display:flex;align-items:center;margin-bottom:3px}
.com-ts{font-size:.66rem;color:var(--mu);flex:1}
.com-del{border:none;background:none;color:var(--r);cursor:pointer;font-size:.8rem;padding:0 3px}
.com-txt{font-size:.82rem;line-height:1.6;color:#374151}
.com-inp-row{display:flex;gap:7px;align-items:flex-end;margin-top:7px}
.com-ta{flex:1;border:1.5px solid #bfdbfe;border-radius:7px;padding:7px 9px;font-size:.8rem;font-family:var(--fb);resize:vertical;outline:none;background:var(--wh)}
.com-send{border:none;color:white;border-radius:7px;padding:7px 11px;font-size:.76rem;font-weight:600;cursor:pointer;font-family:var(--fb);white-space:nowrap}

/* FORMALIZAÇÃO JURÍDICA */
.jur-status-card{display:flex;gap:14px;align-items:flex-start;background:var(--wh);border-radius:14px;padding:18px;box-shadow:0 1px 6px rgba(0,0,0,.07);border-left:6px solid var(--go);margin-bottom:8px}
.jur-status-icon{font-size:2rem;flex-shrink:0}
.jur-status-tit{font-weight:700;font-size:.88rem;margin-bottom:5px;color:var(--go)}
.jur-status-txt{font-size:.84rem;line-height:1.7;color:#374151}
.jur-caminhos{display:flex;flex-direction:column;gap:14px;margin-bottom:28px}
.jur-card{display:flex;gap:0;background:var(--wh);border-radius:14px;box-shadow:0 1px 6px rgba(0,0,0,.07);overflow:hidden;border:1.5px solid var(--bd)}
.jur-num{font-family:var(--fm);font-size:2.5rem;font-weight:700;color:rgba(26,107,46,.15);padding:20px 16px;flex-shrink:0;display:flex;align-items:flex-start;min-width:68px}
.jur-body{padding:18px 18px 18px 0;flex:1}
.jur-tit{font-family:var(--fd);font-size:1.1rem;font-weight:700;margin-bottom:4px}
.jur-nivel{font-size:.7rem;font-family:var(--fm);color:var(--mu);margin-bottom:9px;background:var(--li);display:inline-block;padding:3px 8px;border-radius:5px}
.jur-desc{font-size:.85rem;line-height:1.75;color:#374151;margin-bottom:10px}
.jur-passos-tit{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--g);margin-bottom:7px}
.jur-passos{padding-left:18px;display:flex;flex-direction:column;gap:5px;margin-bottom:9px}
.jur-passos li{font-size:.82rem;line-height:1.65;color:#374151}
.jur-base{font-size:.72rem;color:var(--mu);font-style:italic;background:var(--gl);padding:6px 10px;border-radius:6px;border-left:3px solid var(--g)}
.jur-recomendacao{background:linear-gradient(135deg,#072b13,#1a6b2e);border-radius:14px;padding:22px 24px;color:white;margin-bottom:20px}
.jr-tit{font-family:var(--fd);font-size:1.15rem;font-weight:700;color:#9ef0b4;margin-bottom:10px}
.jr-txt p{font-size:.86rem;line-height:1.7;margin-bottom:8px;opacity:.9}
.jr-txt ul{padding-left:18px;display:flex;flex-direction:column;gap:7px}
.jr-txt li{font-size:.84rem;line-height:1.65;opacity:.88}
.jur-proximos{background:var(--wh);border-radius:14px;padding:20px;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.jp-tit{font-weight:700;font-size:.88rem;margin-bottom:14px;color:var(--g)}
.jp-lista{display:flex;flex-direction:column;gap:10px}
.jp-item{display:flex;gap:11px;align-items:flex-start}
.jp-n{width:24px;height:24px;border-radius:50%;background:var(--g);color:white;font-family:var(--fm);font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.jp-item div{font-size:.84rem;line-height:1.65;color:#374151}

/* CARTA COMPLETA */
.carta-wrap{max-width:680px;margin:0 auto;background:var(--wh);border-radius:16px;padding:44px 48px;box-shadow:0 4px 22px rgba(0,0,0,.08)}
.carta-hd{text-align:center;margin-bottom:28px;padding-bottom:24px;border-bottom:2px solid var(--gl)}
.carta-leaf{font-size:2.8rem;margin-bottom:10px}
.carta-h1{font-family:var(--fd);font-size:clamp(1.8rem,4vw,2.5rem);font-weight:900;line-height:1.1;margin-bottom:8px}
.carta-h1 span{color:var(--g)}
.carta-tagline{font-family:var(--fd);font-style:italic;font-size:.98rem;color:#555;line-height:1.6;margin-bottom:10px}
.carta-meta{font-size:.7rem;color:#aaa;letter-spacing:.04em}
.carta-quote{font-family:var(--fd);font-style:italic;font-size:1.05rem;line-height:1.8;color:#444;padding:16px 20px;border-left:4px solid #3aab6b;background:var(--gl);border-radius:0 9px 9px 0;margin-bottom:24px}
.carta-sec{margin-bottom:22px}
.carta-sec h2{font-family:var(--fd);font-size:1.05rem;color:var(--g);margin-bottom:9px;padding-bottom:5px;border-bottom:2px solid var(--gl)}
.carta-sec p{font-size:.88rem;line-height:1.9;color:#374151;margin-bottom:10px}
.carta-lista{padding-left:18px;display:flex;flex-direction:column;gap:5px}
.carta-lista li{font-size:.86rem;line-height:1.7;color:#374151}
.carta-assinatura{background:linear-gradient(135deg,#0a3d1a,var(--g));border-radius:13px;padding:26px;text-align:center;margin-top:26px}
.carta-assinatura h2{font-family:var(--fd);font-size:1.35rem;color:#f0c060;margin-bottom:9px}
.carta-assinatura p{font-family:var(--fd);font-style:italic;font-size:.88rem;color:rgba(255,255,255,.8);line-height:1.7}

/* LOG */
.log-item{background:var(--wh);border-radius:9px;padding:10px 13px;margin-bottom:6px;box-shadow:0 1px 4px rgba(0,0,0,.05);border-left:3px solid var(--g)}
.log-meta{display:flex;gap:8px;align-items:center;margin-bottom:2px}
.log-ts{font-size:.65rem;color:var(--mu)}
.log-a{font-size:.82rem;font-weight:500}
.log-d{font-size:.74rem;color:var(--mu);margin-top:2px;padding-left:7px;border-left:2px solid var(--bd);line-height:1.5}
.empty{text-align:center;padding:28px;color:var(--mu);font-style:italic;background:var(--li);border-radius:11px}

/* SEM ACESSO */
.sem-acesso{text-align:center;padding:48px 20px;background:var(--wh);border-radius:14px;box-shadow:0 1px 7px rgba(0,0,0,.07)}
.sem-acesso h3{font-family:var(--fd);font-size:1.2rem;margin-bottom:7px}
.sem-acesso p{color:var(--mu);font-size:.85rem}

/* MODAL LOGIN */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:500;backdrop-filter:blur(4px)}
.modal-card{background:var(--wh);border-radius:18px;padding:36px 32px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-icon{font-size:2.2rem;margin-bottom:12px}
.modal-tit{font-family:var(--fd);font-size:1.5rem;font-weight:700;margin-bottom:4px}
.modal-sub{font-size:.78rem;color:var(--mu);margin-bottom:20px}
.modal-inp{width:100%;border:1.5px solid var(--bd);border-radius:9px;padding:11px 14px;font-size:.9rem;font-family:var(--fb);outline:none;text-align:center;margin-bottom:10px;background:var(--li)}
.modal-inp:focus{border-color:var(--g)}
.modal-btn{width:100%;background:var(--g);color:white;border:none;border-radius:9px;padding:11px;font-size:.88rem;font-weight:600;cursor:pointer;font-family:var(--fb);margin-bottom:8px;transition:all .15s}
.modal-btn:hover{background:#145524}
.modal-cancel{background:none;border:none;color:var(--mu);cursor:pointer;font-size:.8rem;font-family:var(--fb)}

/* TOAST */
.toast{position:fixed;bottom:18px;right:18px;background:#111827;color:white;padding:9px 16px;border-radius:9px;font-size:.8rem;font-weight:500;opacity:0;transform:translateY(8px);transition:all .25s;z-index:999;pointer-events:none;font-family:var(--fb)}
.toast.show{opacity:1;transform:translateY(0)}
.toast.warn{background:#854d0e}.toast.err{background:#991b1b}

/* PRINT */
@media print{.nav,.dem-btns,.add-d-row,.ap-btns,.com-inp-row,.btn-save,.btn-logout{display:none!important}.main{padding:0}}

/* MOBILE */
@media(max-width:660px){
  .nav{padding:0 11px}
  .main{padding:12px 10px 60px}
  .hero{padding:24px 16px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .carta-wrap{padding:22px 14px}
  .ap-grid{grid-template-columns:1fr}
  .ap-wide{grid-column:1}
  .prog-geral{flex-direction:column;align-items:flex-start;gap:7px}
  .jur-card{flex-direction:column}
  .jur-num{padding:12px 16px 0;font-size:1.8rem}
  .jur-body{padding:10px 16px 16px}
  .timeline{padding:12px 14px}
}
</style>
</body>
</html>

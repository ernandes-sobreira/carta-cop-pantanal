// ── FIREBASE ───────────────────────────────────────────────────────────────
async function fbLoad(){
  try{
    const s=await db.ref(BASE).get();
    if(s.exists()){
      const d=s.val();
      if(d.eixos)ST.eixos=d.eixos;
      if(d.instrumento)ST.instrumento=d.instrumento;
      if(d.signatarios)ST.signatarios=d.signatarios;
      if(d.propostas)ST.propostas=d.propostas;
      if(d.log)ST.log=d.log;
    }else{await fbSave();}
    setStatus("Firebase ativo","ok");
  }catch(e){setStatus("Modo local","warn");}
}
async function fbSave(){
  try{await db.ref(BASE).set(ST);setStatus("Salvo "+new Date().toLocaleTimeString('pt-BR'),"ok");}
  catch(e){setStatus("Erro ao salvar","err");}
}
function addLog(a,d){
  ST.log.unshift({ts:new Date().toISOString(),user:USER,acao:a,detalhe:d||""});
  if(ST.log.length>500)ST.log=ST.log.slice(0,500);
}
function setStatus(m,t){const e=document.getElementById('pill');if(e){e.textContent=m;e.className='pill '+t;}}
function toast(m,t='ok'){
  const e=document.getElementById('toast');
  e.textContent=m;e.className='toast show'+(t!=='ok'?' '+t:'');
  setTimeout(()=>e.className='toast',3000);
}
function fmt(iso){if(!iso)return'—';return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function fmtDate(iso){if(!iso)return'—';return new Date(iso+'T00:00:00').toLocaleDateString('pt-BR');}

// ── RENDER PRINCIPAL ───────────────────────────────────────────────────────
let VIEW='home';
function render(){
  const app=document.getElementById('app');
  if(!USER){renderLogin(app);return;}
  let html=buildNav()+`<div class="main-content">`;
  if(VIEW==='home') html+=renderHome();
  else if(VIEW==='instrumento') html+=renderInstrumento();
  else if(VIEW==='eixos') html+=renderEixos();
  else if(VIEW==='signatarios') html+=renderSignatarios();
  else if(VIEW==='propostas') html+=renderPropostas();
  else if(VIEW==='admin') html+=renderAdmin();
  else if(VIEW==='log') html+=renderLog();
  html+=`</div>`;
  app.innerHTML=html;
}

        <div class="doc-foot-text">Instrumento produzido coletivamente no âmbito da II COP Pantanal — Cáceres-MT, 2026</div>
        <div class="doc-foot-sub">Base para apresentação à Câmara Municipal, ALMT e parceiros institucionais</div>
        <button class="btn-print" onclick="window.print()">🖨️ Imprimir / Exportar PDF</button>
      </div>
    </div>
  </div>`;
}

// ── EIXOS / CLÁUSULAS ──────────────────────────────────────────────────────
function renderEixos(){
  const totalC=ST.eixos.reduce((a,e)=>a+(e.clausulas||[]).length,0);
  const aprov=ST.eixos.reduce((a,e)=>a+(e.clausulas||[]).filter(c=>c.status==='aprovada').length,0);
  return`
  <div class="page-header">
    <div class="ph-badge">Revisão Coletiva</div>
    <h2 class="ph-title">⚖️ Cláusulas Jurídicas por Eixo</h2>
    <p class="ph-sub">${aprov} de ${totalC} cláusulas aprovadas · Revise, proponha alterações e vote</p>
  </div>
  ${ST.eixos.map((e,ei)=>`
  <div class="eixo-bloco" id="eb_${e.id}">
    <div class="eixo-header" onclick="togEixo('${e.id}')" style="--ec:${e.cor}">
      <div class="eh-left">
        <span class="eh-icon">${e.icon||'⚖️'}</span>
        <div>
          <div class="eh-titulo">${e.titulo}</div>
          <div class="eh-sub">${e.sub}</div>
        </div>
      </div>
      <div class="eh-right">
        ${(e.clausulas||[]).filter(c=>c.prioridade==='urgente').length>0?`<span class="tag-urg">🚨 ${(e.clausulas||[]).filter(c=>c.prioridade==='urgente').length} urgente(s)</span>`:''}
        <span class="eh-cnt" style="color:${e.cor}">${(e.clausulas||[]).filter(c=>c.status==='aprovada').length}/${(e.clausulas||[]).length}</span>
        <span class="eh-tog" id="et_${e.id}">▼</span>
      </div>
    </div>
    <div class="eixo-corpo" id="ec_${e.id}" style="display:none">
      ${(e.clausulas||[]).map((c,ci)=>`
      <div class="clausula-card ${c.status}" id="cc_${c.id}">
        <div class="cc-header">
          <div class="cc-num" style="background:${e.cor}">${ei+1}.${ci+1}</div>
          <div class="cc-tags">
            <span class="ctag" style="background:${TIPO_COR[c.tipo]||'#999'}">${TIPO_LABEL[c.tipo]||c.tipo}</span>
            <span class="ctag prior-${c.prioridade}">${c.prioridade}</span>
          </div>
          <div class="cc-status">
            ${IS_ADMIN?`<select class="st-sel" onchange="window.setClausulaStatus('${e.id}','${c.id}',this.value)" style="border-color:${STATUS_COR[c.status]||'#999'}">
              <option value="proposta" ${c.status==='proposta'?'selected':''}>Proposta</option>
              <option value="revisao" ${c.status==='revisao'?'selected':''}>Em revisão</option>
              <option value="aprovada" ${c.status==='aprovada'?'selected':''}>Aprovada</option>
              <option value="vetada" ${c.status==='vetada'?'selected':''}>Vetada</option>
            </select>`:`<span class="st-badge st-${c.status}">${c.status}</span>`}
          </div>
          <div class="cc-actions">
            ${IS_ADMIN?`<button class="cc-btn edit" title="Editar" onclick="window.editClausula('${e.id}','${c.id}')">✏️</button>
            <button class="cc-btn del" title="Remover" onclick="window.delClausula('${e.id}','${c.id}')">🗑️</button>`:''}
            <button class="cc-btn prop" title="Propor alteração" onclick="window.novaProposta('${e.id}','${c.id}')">💬</button>
          </div>
        </div>
        <p class="cc-texto">${c.texto}</p>
        ${(ST.propostas||[]).filter(p=>p.clausulaId===c.id&&p.status==='aberta').length>0?`
        <div class="cc-props-badge">💬 ${(ST.propostas||[]).filter(p=>p.clausulaId===c.id&&p.status==='aberta').length} proposta(s) em aberto</div>`:''}
      </div>`).join('')}
      ${IS_ADMIN?`
      <div class="add-clausula-row">
        <button class="btn-add-clausula" onclick="window.addClausula('${e.id}')">+ Nova cláusula neste eixo</button>
      </div>`:''}

  </div>`).join('')}`;
}

// ── SIGNATÁRIOS ────────────────────────────────────────────────────────────

  const pend=ST.signatarios.filter(s=>s.status==='pendente');

    <div class="ph-badge">Gestão de Adesões</div>

  </div>

  ${conf.length>0?`<div class="sig-section-title"><span style="color:#1a6b2e">✅ Confirmados (${conf.length})</span></div>
  <div class="sig-grid">
    ${conf.map(s=>renderSigCard(s,'confirmado')).join('')}

  ${pend.length>0?`<div class="sig-section-title"><span style="color:#d4890a">⏳ Pendentes (${pend.length})</span></div>

  </div>`:''}

  ${conv.length>0?`<div class="sig-section-title"><span style="color:#0d5c8f">📧 Convidados (${conv.length})</span></div>
  <div class="sig-grid">
    ${conv.map(s=>renderSigCard(s,'convidado')).join('')}

  ${ST.signatarios.length===0?`<div class="empty-state">Nenhum signatário cadastrado ainda.</div>`:''}

    <div class="sig-ref-grid">
      <div class="sig-ref-item">🏛️ Prefeituras municipais da bacia do Rio Paraguai</div>
      <div class="sig-ref-item">🎓 Universidades e institutos de pesquisa (UNEMAT, UFMT, INPA...)</div>
      <div class="sig-ref-item">🌿 ONGs e organizações da sociedade civil</div>
      <div class="sig-ref-item">👥 Associações de povos tradicionais e indígenas</div>
      <div class="sig-ref-item">🏫 Secretarias municipais e estaduais de meio ambiente</div>
      <div class="sig-ref-item">🌍 Organismos internacionais (UNESCO, PNUMA...)</div>

      <div class="sig-ref-item">📰 Veículos de comunicação e jornalismo ambiental</div>

function renderSigCard(s,status){
  const bc={confirmado:'#1a6b2e',pendente:'#d4890a',convidado:'#0d5c8f'}[status]||'#999';
  return`<div class="sig-card" style="--sc:${bc}">
    <div class="sc-head">
      <div class="sc-nome">${s.nome}</div>
      <span class="sc-status" style="background:${bc}">${status}</span>
    </div>
    <div class="sc-tipo">${s.tipo}</div>
    <div class="sc-meta">📍 ${s.municipio}${s.representante?' · 👤 '+s.representante:''}${s.data?' · 📅 '+fmtDate(s.data):''}</div>
    ${IS_ADMIN?`<div class="sc-actions">
      <button class="sc-btn" onclick="window.editSig('${s.id}')">✏️ Editar</button>
      ${status==='pendente'?`<button class="sc-btn green" onclick="window.confirmSig('${s.id}')">✅ Confirmar</button>`:''}
      <button class="sc-btn red" onclick="window.delSig('${s.id}')">🗑️</button>
    </div>`:''}
  </div>`;
}

// ── PROPOSTAS ──────────────────────────────────────────────────────────────
function renderPropostas(){
  const abertas=(ST.propostas||[]).filter(p=>p.status==='aberta');
  const resolvidas=(ST.propostas||[]).filter(p=>p.status!=='aberta');
  return`
  <div class="page-header">
    <div class="ph-badge">Participação Coletiva</div>
    <h2 class="ph-title">💬 Propostas de Alteração</h2>
    <p class="ph-sub">${abertas.length} em aberto · ${resolvidas.length} resolvidas</p>
  </div>

  ${abertas.length>0?`<div class="sig-section-title"><span style="color:#d4890a">⏳ Em aberto (${abertas.length})</span></div>
  ${abertas.map(p=>renderPropostaCard(p)).join('')}`:'<div class="empty-state">Nenhuma proposta em aberto.</div>'}

  ${resolvidas.length>0?`<div class="sig-section-title"><span style="color:#9ca3af">Resolvidas (${resolvidas.length})</span></div>
  ${resolvidas.map(p=>renderPropostaCard(p)).join('')}`:''}`;
}

function renderPropostaCard(p){
  const eixo=ST.eixos.find(e=>(e.clausulas||[]).find(c=>c.id===p.clausulaId));
  const clausula=eixo&&(eixo.clausulas||[]).find(c=>c.id===p.clausulaId);
  return`<div class="prop-card prop-${p.status}">
    <div class="prop-head">
      <div class="prop-meta">
        <span class="prop-user">${p.user}</span>
        <span class="prop-ts">${fmt(p.ts)}</span>
        <span class="prop-ref">${eixo?eixo.titulo:'?'}</span>
      </div>
      <span class="prop-status-tag ${p.status}">${p.status}</span>
    </div>
    ${clausula?`<div class="prop-original"><strong>Cláusula original:</strong> ${clausula.texto.slice(0,120)}...</div>`:''}
    <div class="prop-texto"><strong>Proposta:</strong> ${p.texto}</div>
    ${IS_ADMIN&&p.status==='aberta'?`<div class="prop-actions">
      <button class="prop-btn accept" onclick="window.aceitarProposta('${p.id}')">✅ Aceitar e aplicar</button>
      <button class="prop-btn reject" onclick="window.rejeitarProposta('${p.id}')">❌ Rejeitar</button>
    </div>`:''}
  </div>`;
}

// ── ADMIN ──────────────────────────────────────────────────────────────────
function renderAdmin(){
  if(!IS_ADMIN)return`<div class="page-header"><h2>Acesso negado</h2></div>`;
  const total=ST.eixos.reduce((a,e)=>a+(e.clausulas||[]).length,0);
  const sigs=ST.signatarios.length;
  const props=(ST.propostas||[]).length;
  const logs=ST.log.length;
  return`
  <div class="page-header">
    <div class="ph-badge">Administração</div>
    <h2 class="ph-title">⚙️ Painel Admin</h2>
    <p class="ph-sub">Gestão completa do instrumento jurídico</p>
  </div>

  <div class="admin-grid">
    <div class="admin-section">
      <div class="admin-sec-title">📜 Instrumento</div>
      <button class="admin-btn" onclick="window.editInst()">Editar título e preâmbulo</button>
      <button class="admin-btn" onclick="window.editFundamentacao()">Editar fundamentação legal</button>
      <button class="admin-btn warn" onclick="window.gerarPDF()">🖨️ Gerar versão para impressão</button>
    </div>
    <div class="admin-section">
      <div class="admin-sec-title">⚖️ Cláusulas</div>
      <div class="admin-stats">${total} cláusulas em ${ST.eixos.length} eixos</div>
      ${ST.eixos.map(e=>`<button class="admin-btn" onclick="window.setView('eixos')" style="border-left:4px solid ${e.cor}">${e.titulo.slice(0,35)}...</button>`).join('')}
    </div>
    <div class="admin-section">
      <div class="admin-sec-title">✍️ Signatários</div>
      <div class="admin-stats">${sigs} cadastrados · ${ST.signatarios.filter(s=>s.status==='confirmado').length} confirmados</div>
      <button class="admin-btn" onclick="window.addSignatario()">+ Adicionar signatário</button>
      <button class="admin-btn" onclick="window.exportSignatarios()">📤 Exportar lista</button>
    </div>
    <div class="admin-section">
      <div class="admin-sec-title">💬 Propostas</div>
      <div class="admin-stats">${props} propostas · ${(ST.propostas||[]).filter(p=>p.status==='aberta').length} em aberto</div>
      <button class="admin-btn" onclick="window.setView('propostas')">Ver todas as propostas</button>
    </div>
    <div class="admin-section">
      <div class="admin-sec-title">🗄️ Dados</div>
      <div class="admin-stats">${logs} entradas no registro</div>
      <button class="admin-btn" onclick="window.expJSON()">⬇️ Exportar JSON completo</button>
      <button class="admin-btn warn" onclick="window.resetConfirm()">⚠️ Reset dados (CUIDADO)</button>
    </div>
    <div class="admin-section">
      <div class="admin-sec-title">🗓️ COP II — Estrutura por Eixos</div>
      <p style="font-size:.82rem;color:#6b7280;line-height:1.6">Cada eixo terá um subevento com auditório próprio, atores sociais específicos, facilitador temático e relator. Plenária de convergência ao final.</p>
      <button class="admin-btn" onclick="window.gerarEstruturaCOP()">Gerar estrutura do evento</button>
    </div>
  </div>`;
}

// ── LOG ────────────────────────────────────────────────────────────────────
function renderLog(){
  return`
  <div class="page-header">
    <div class="ph-badge">Auditoria</div>
    <h2 class="ph-title">📋 Registro de Ações</h2>
    <p class="ph-sub">${ST.log.length} entradas registradas</p>

    ST.log.map(l=>`<div class="log-item">

// ── ACTIONS ────────────────────────────────────────────────────────────────
window.doLogin=function(name,role,bg){
  USER=name;IS_ADMIN=(role==='admin');
  addLog("Login",name+" ("+role+")");
  fbLoad().then(()=>{VIEW='home';render();});
};
window.doLogout=function(){USER=null;IS_ADMIN=false;VIEW='home';render();};
window.setView=function(v){VIEW=v;render();};
window.salvar=async function(){addLog("Salvamento manual","por "+USER);await fbSave();toast("Salvo no Firebase!");};

window.togEixo=function(id){
  const b=document.getElementById('ec_'+id),t=document.getElementById('et_'+id);
  if(!b)return;const op=b.style.display!=='none';
  b.style.display=op?'none':'block';if(t)t.textContent=op?'▼':'▲';
};

window.setClausulaStatus=async function(eid,cid,val){
  const e=ST.eixos.find(x=>x.id===eid);if(!e)return;
  const c=(e.clausulas||[]).find(x=>x.id===cid);if(!c)return;
  c.status=val;
  addLog("Status de cláusula alterado",`${c.texto.slice(0,60)} → ${val}`);
  await fbSave();toast(`Cláusula marcada como: ${val}`);
};

window.editClausula=function(eid,cid){
  const e=ST.eixos.find(x=>x.id===eid);if(!e)return;
  const c=(e.clausulas||[]).find(x=>x.id===cid);if(!c)return;
  const nt=prompt("Editar texto da cláusula:",c.texto);
  if(!nt||!nt.trim())return;
  c.texto=nt.trim();addLog("Cláusula editada",nt.slice(0,80));
  fbSave().then(()=>{render();toast("Cláusula atualizada");});
};

window.delClausula=async function(eid,cid){
  if(!confirm("Remover esta cláusula?"))return;
  const e=ST.eixos.find(x=>x.id===eid);if(!e)return;
  const c=(e.clausulas||[]).find(x=>x.id===cid);
  addLog("Cláusula removida",c?c.texto.slice(0,60):cid);
  e.clausulas=(e.clausulas||[]).filter(x=>x.id!==cid);
  await fbSave();render();toast("Removida");
};

window.addClausula=async function(eid){
  const e=ST.eixos.find(x=>x.id===eid);if(!e)return;
  const texto=prompt("Texto da nova cláusula:");if(!texto||!texto.trim())return;
  const tipo=prompt("Tipo (obrigacao/compromisso/declaracao):")||"compromisso";
  const prior=prompt("Prioridade (urgente/alta/media):")||"alta";
  if(!e.clausulas)e.clausulas=[];
  e.clausulas.push({id:'c_'+Date.now(),tipo,texto:texto.trim(),prioridade:prior,status:'proposta'});
  addLog("Nova cláusula",texto.slice(0,80));await fbSave();render();toast("Cláusula adicionada!");
};

window.novaProposta=function(eid,cid){
  const texto=prompt("Sua proposta de alteração para esta cláusula:");
  if(!texto||!texto.trim())return;
  if(!ST.propostas)ST.propostas=[];
  ST.propostas.unshift({id:'p_'+Date.now(),eixoId:eid,clausulaId:cid,user:USER,ts:new Date().toISOString(),texto:texto.trim(),status:'aberta'});
  addLog("Nova proposta",texto.slice(0,80));fbSave().then(()=>{render();toast("Proposta enviada!");});
};

window.aceitarProposta=async function(pid){
  const p=(ST.propostas||[]).find(x=>x.id===pid);if(!p)return;
  const e=ST.eixos.find(x=>x.id===p.eixoId);
  const c=e&&(e.clausulas||[]).find(x=>x.id===p.clausulaId);
  if(c){c.texto=p.texto;c.status='revisao';}
  p.status='aceita';addLog("Proposta aceita e aplicada",p.texto.slice(0,80));
  await fbSave();render();toast("Proposta aplicada!");
};
window.rejeitarProposta=async function(pid){
  const p=(ST.propostas||[]).find(x=>x.id===pid);if(!p)return;
  p.status='rejeitada';addLog("Proposta rejeitada","");
  await fbSave();render();toast("Proposta rejeitada");
};

window.addSignatario=function(){
  const nome=prompt("Nome da instituição/pessoa:");if(!nome||!nome.trim())return;
  const tipo=prompt("Tipo (ex: Prefeitura Municipal, Universidade, ONG...):")||"";
  const municipio=prompt("Município-UF:")|| "Cáceres-MT";
  const rep=prompt("Representante (opcional):")||"";
  ST.signatarios.push({id:'sig_'+Date.now(),nome:nome.trim(),tipo:tipo.trim(),municipio:municipio.trim(),representante:rep.trim(),status:'pendente',data:''});
  addLog("Signatário adicionado",nome);fbSave().then(()=>{render();toast("Signatário adicionado!");});
};
window.confirmSig=async function(sid){
  const s=ST.signatarios.find(x=>x.id===sid);if(!s)return;
  s.status='confirmado';s.data=new Date().toISOString().slice(0,10);
  addLog("Signatário confirmado",s.nome);await fbSave();render();toast("Confirmado!");
};
window.editSig=function(sid){
  const s=ST.signatarios.find(x=>x.id===sid);if(!s)return;
  const nn=prompt("Nome:",s.nome);if(!nn||!nn.trim())return;
  s.nome=nn.trim();
  const nr=prompt("Representante:",s.representante||"");s.representante=(nr||"").trim();
  addLog("Signatário editado",s.nome);fbSave().then(()=>{render();toast("Atualizado");});
};
window.delSig=async function(sid){
  if(!confirm("Remover signatário?"))return;
  const s=ST.signatarios.find(x=>x.id===sid);
  addLog("Signatário removido",s?s.nome:sid);
  ST.signatarios=ST.signatarios.filter(x=>x.id!==sid);
  await fbSave();render();toast("Removido");
};

window.editInst=function(){
  const t=prompt("Título:",ST.instrumento.titulo);if(!t)return;
  ST.instrumento.titulo=t.trim();
  const p=prompt("Preâmbulo:",ST.instrumento.preambulo);
  if(p)ST.instrumento.preambulo=p.trim();
  addLog("Instrumento editado","título e preâmbulo");fbSave().then(()=>{render();toast("Instrumento atualizado");});
};
window.editFundamentacao=function(){
  const atual=ST.instrumento.fundamentacao.join('\n');
  const nova=prompt("Fundamentação (uma por linha):",atual);
  if(!nova)return;
  ST.instrumento.fundamentacao=nova.split('\n').map(x=>x.trim()).filter(Boolean);
  addLog("Fundamentação legal editada","");fbSave().then(()=>{render();toast("Fundamentação atualizada");});
};

window.gerarEstruturaCOP=function(){
  const estrutura=ST.eixos.map(e=>`${e.titulo}\n- Auditório próprio\n- Atores específicos\n- Facilitador temático\n- Relator\n- Produto: contribuição ao documento final\n`).join('\n');
  alert("ESTRUTURA COP PANTANAL II\n\n"+estrutura+"\n\nPlenária de Convergência: todos os relatores apresentam síntese coletiva.");
};
window.gerarPDF=function(){window.print();};
window.expJSON=function(){
  const b=new Blob([JSON.stringify(ST,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='cop_pantanal_II.json';a.click();
};
window.exportSignatarios=function(){
  let txt="SIGNATÁRIOS — COP PANTANAL II\n"+"=".repeat(40)+"\n\n";
  ST.signatarios.forEach(s=>{txt+=`${s.nome}\n${s.tipo} · ${s.municipio}\nStatus: ${s.status}${s.data?' · '+fmtDate(s.data):''}\n\n`;});
  const b=new Blob([txt],{type:'text/plain'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='signatarios.txt';a.click();
};
window.resetConfirm=function(){if(confirm("ATENÇÃO: isso apagará todos os dados. Tem certeza?"))if(confirm("Confirme novamente para resetar."))fbSave().then(()=>toast("Reset feito","warn"));};

document.addEventListener("DOMContentLoaded", function(){ render(); });
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1a6b2e;--green-l:#e8f5ee;--red:#c0392b;--blue:#0d5c8f;--gold:#d4890a;--purple:#6c3483;--teal:#1a7a6b;
  --bg:#f8f9fa;--white:#ffffff;--border:#e5e7eb;--text:#1f2937;--muted:#6b7280;--light:#f3f4f6;
  --font-display:'Cormorant Garamond',Georgia,serif;--font-body:'Outfit',sans-serif;--font-mono:'Space Mono',monospace;
}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}

/* ── LOGIN ── */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;background:#f0faf5;overflow:hidden}
.login-bg-shapes{position:absolute;inset:0;pointer-events:none}
.shape{position:absolute;border-radius:50%;opacity:.08}
.shape.s1{width:600px;height:600px;background:var(--green);top:-200px;right:-150px}
.shape.s2{width:400px;height:400px;background:var(--blue);bottom:-100px;left:-100px}
.shape.s3{width:200px;height:200px;background:var(--gold);top:40%;right:10%}
.login-card{position:relative;background:white;border-radius:24px;padding:48px 44px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.12),0 4px 16px rgba(0,0,0,.06);border:1px solid #e8f5ee}
.login-badge{display:inline-block;background:var(--green);color:white;font-family:var(--font-mono);font-size:.7rem;letter-spacing:.12em;padding:5px 12px;border-radius:20px;margin-bottom:20px}
.login-title{font-family:var(--font-display);font-size:2.8rem;font-weight:700;line-height:1.1;color:var(--text);margin-bottom:12px}
.login-title em{color:var(--green);font-style:italic}
.login-desc{color:var(--muted);font-size:.9rem;line-height:1.6;margin-bottom:28px}
.login-divider{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.login-divider span{font-size:.75rem;color:var(--muted);font-weight:500;white-space:nowrap;text-transform:uppercase;letter-spacing:.08em}
.login-users{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.login-user-btn{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1.5px solid var(--border);border-radius:14px;background:white;cursor:pointer;transition:all .2s;text-align:left;font-family:var(--font-body)}
.login-user-btn:hover{border-color:var(--green);background:var(--green-l);transform:translateX(4px)}
.lu-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:.85rem;flex-shrink:0}
.lu-info{flex:1}.lu-name{display:block;font-weight:600;font-size:.9rem;color:var(--text)}.lu-role{display:block;font-size:.75rem;color:var(--muted)}
.lu-arr{font-size:1.1rem;color:var(--muted)}
.login-footer{text-align:center;font-family:var(--font-display);font-style:italic;color:var(--muted);font-size:.9rem}

/* ── NAV ── */
.top-nav{display:flex;align-items:center;gap:0;background:white;border-bottom:1px solid var(--border);padding:0 24px;height:60px;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.nav-brand{display:flex;align-items:center;gap:10px;padding-right:20px;border-right:1px solid var(--border);margin-right:16px;flex-shrink:0}
.nav-leaf{font-size:1.4rem}
.nav-title{font-family:var(--font-display);font-size:1rem;font-weight:700;line-height:1.1}
.nav-sub{font-size:.65rem;color:var(--muted)}
.nav-links{display:flex;align-items:center;gap:2px;flex:1;overflow-x:auto}
.nav-link{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:.8rem;font-weight:500;color:var(--muted);text-decoration:none;white-space:nowrap;transition:all .15s}
.nav-link:hover{color:var(--green);background:var(--green-l)}
.nav-link.active{color:var(--green);background:var(--green-l);font-weight:600}
.nav-right{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-left:auto;padding-left:16px;border-left:1px solid var(--border)}
#pill{font-size:.68rem;font-family:var(--font-mono);padding:3px 8px;border-radius:20px;white-space:nowrap}
.pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fef9c3;color:#854d0e}.pill.err{background:#fee2e2;color:#991b1b}
.nav-user{display:flex;align-items:center;gap:8px}
.nav-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:.72rem;flex-shrink:0}
.nav-name{font-size:.8rem;font-weight:500;color:var(--text)}
.admin-badge{background:var(--red);color:white;font-size:.62rem;font-family:var(--font-mono);padding:2px 6px;border-radius:4px;letter-spacing:.06em}
.btn-save{border:1.5px solid var(--green);background:white;color:var(--green);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:.9rem;font-family:var(--font-body);transition:all .15s}
.btn-save:hover{background:var(--green);color:white}
.btn-logout{border:1.5px solid var(--border);background:white;color:var(--muted);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:.78rem;font-family:var(--font-body);transition:all .15s}
.btn-logout:hover{background:var(--light);color:var(--text)}

/* ── LAYOUT ── */
.main-content{max-width:1100px;margin:0 auto;padding:28px 24px 80px}

/* ── PAGE HEADER ── */
.page-header{margin-bottom:28px;position:relative}
.ph-badge{display:inline-block;background:var(--green-l);color:var(--green);font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:20px;margin-bottom:8px}
.ph-title{font-family:var(--font-display);font-size:2rem;font-weight:700;color:var(--text);margin-bottom:6px}
.ph-sub{color:var(--muted);font-size:.9rem}
.btn-edit-inst,.btn-primary,.btn-outline{padding:9px 18px;border-radius:10px;font-size:.82rem;font-weight:600;cursor:pointer;font-family:var(--font-body);transition:all .15s;border:none;margin-top:12px;display:inline-block}
.btn-primary{background:var(--green);color:white}
.btn-primary:hover{background:#145524}
.btn-outline{background:white;color:var(--green);border:2px solid var(--green)}
.btn-outline:hover{background:var(--green-l)}
.btn-edit-inst{background:var(--gold);color:white}

/* ── HOME HERO ── */
.home-hero{background:linear-gradient(135deg,#0a3d1a,#1a6b2e 50%,#1d5a2e);border-radius:20px;padding:48px 44px;color:white;margin-bottom:28px;position:relative;overflow:hidden}
.home-hero::before{content:'';position:absolute;top:-60px;right:-60px;width:300px;height:300px;background:rgba(255,255,255,.05);border-radius:50%}
.home-hero::after{content:'';position:absolute;bottom:-40px;left:20%;width:200px;height:200px;background:rgba(255,255,255,.04);border-radius:50%}
.hero-eyebrow{font-size:.78rem;font-family:var(--font-mono);letter-spacing:.1em;opacity:.8;margin-bottom:16px}
.hero-h1{font-family:var(--font-display);font-size:clamp(2rem,4vw,3rem);font-weight:700;line-height:1.05;margin-bottom:16px}
.hero-h1 em{color:#9ef0b4;font-style:italic}
.hero-lead{font-size:.95rem;opacity:.85;max-width:600px;line-height:1.7;margin-bottom:24px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}

/* ── KPI GRID ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:32px}
.kpi-card{background:white;border-radius:14px;padding:18px 16px;border-top:4px solid var(--kc,#1a6b2e);box-shadow:0 1px 6px rgba(0,0,0,.06);text-align:center;transition:transform .2s}
.kpi-card:hover{transform:translateY(-2px)}
.kpi-icon{font-size:1.4rem;margin-bottom:6px}
.kpi-val{font-family:var(--font-display);font-size:2rem;font-weight:700;color:var(--kc,#1a6b2e);line-height:1}
.kpi-label{font-size:.75rem;color:var(--muted);margin-top:4px;font-weight:500}

/* ── SECTION TITLES ── */
.section-title-row{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;margin-top:32px}
.section-title-row h2{font-family:var(--font-display);font-size:1.4rem;font-weight:700}
.section-sub{font-size:.82rem;color:var(--muted)}

/* ── EIXOS PROGRESS ── */
.eixos-progress{display:flex;flex-direction:column;gap:10px;margin-bottom:32px}
.ep-card{display:flex;align-items:center;gap:14px;background:white;border-radius:12px;padding:14px 18px;box-shadow:0 1px 5px rgba(0,0,0,.06);border-left:5px solid var(--ec,#1a6b2e)}
.ep-icon{font-size:1.5rem;flex-shrink:0}
.ep-info{flex:1}
.ep-tit{font-weight:600;font-size:.9rem}
.ep-sub{font-size:.78rem;color:var(--muted);margin-bottom:6px}
.ep-bar-wrap{display:flex;align-items:center;gap:8px}
.ep-bar{flex:1;height:6px;background:var(--light);border-radius:3px;overflow:hidden}
.ep-fill{height:100%;border-radius:3px;transition:width .5s}
.ep-pct{font-size:.75rem;font-family:var(--font-mono);color:var(--muted);min-width:32px}
.ep-cnt{font-family:var(--font-mono);font-size:.85rem;font-weight:700;flex-shrink:0}

/* ── TIPOS ── */
.tipos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tipo-card{background:white;border-radius:14px;padding:20px;box-shadow:0 1px 6px rgba(0,0,0,.06);border:1.5px solid var(--border);transition:all .2s;position:relative}
.tipo-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.1)}
.tipo-num{font-family:var(--font-mono);font-size:2rem;font-weight:700;opacity:.1;position:absolute;top:12px;right:16px}
.tipo-card h3{font-family:var(--font-display);font-size:1.05rem;font-weight:700;margin-bottom:8px}
.tipo-card p{font-size:.82rem;color:var(--muted);line-height:1.6;margin-bottom:10px}
.tipo-tag{display:inline-block;font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.t-adesao{border-top:4px solid var(--green)}.t-adesao .tipo-tag{background:var(--green-l);color:var(--green)}
.t-decreto{border-top:4px solid var(--blue)}.t-decreto .tipo-tag{background:#dbeafe;color:var(--blue)}
.t-plano{border-top:4px solid var(--gold)}.t-plano .tipo-tag{background:#fef3c7;color:#854d0e}
.t-termo{border-top:4px solid var(--purple)}.t-termo .tipo-tag{background:#ede9fe;color:var(--purple)}

/* ── DOCUMENTO JURÍDICO ── */
.doc-wrapper{margin-bottom:32px}
.doc-card{background:white;border-radius:20px;padding:48px;box-shadow:0 4px 24px rgba(0,0,0,.08);border:1px solid var(--border)}
.doc-header{text-align:center;margin-bottom:36px;padding-bottom:28px;border-bottom:2px solid var(--green-l)}
.doc-seal{font-size:3rem;margin-bottom:12px}
.doc-title{font-family:var(--font-display);font-size:1.7rem;font-weight:700;line-height:1.25;color:var(--text);margin-bottom:14px}
.doc-meta{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}
.doc-meta-item{font-size:.75rem;color:var(--muted);background:var(--light);padding:4px 10px;border-radius:20px}
.doc-meta-item.status-rascunho{background:#fef3c7;color:#854d0e}
.doc-meta-item.status-revisao{background:#dbeafe;color:var(--blue)}
.doc-meta-item.status-final{background:var(--green-l);color:var(--green)}
.doc-section{margin-bottom:28px}
.doc-section-label{font-family:var(--font-mono);font-size:.68rem;font-weight:700;letter-spacing:.12em;color:var(--green);text-transform:uppercase;margin-bottom:10px;padding-bottom:4px;border-bottom:2px solid var(--green-l)}
.doc-nature{font-family:var(--font-display);font-size:1.1rem;font-style:italic;color:var(--text);line-height:1.5}
.doc-preamble{font-size:.9rem;line-height:1.9;color:#374151;text-align:justify}
.doc-legal-list{display:flex;flex-direction:column;gap:6px}
.legal-item{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;background:var(--light);border-radius:8px;font-size:.82rem;color:#374151}
.legal-num{font-family:var(--font-mono);font-size:.68rem;color:var(--green);font-weight:700;flex-shrink:0;padding-top:1px}
.doc-clause-intro{font-size:.85rem;color:var(--muted);line-height:1.7;margin-bottom:16px}
.doc-eixo{margin-bottom:20px;border:1.5px solid #f0f0f0;border-radius:12px;overflow:hidden}
.doc-eixo-header{background:var(--light);padding:10px 14px;font-weight:600;font-size:.85rem;border-left:5px solid var(--ec,#1a6b2e)}
.doc-clause{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid #f5f5f5}
.doc-clause:last-child{border-bottom:none}
.clause-num{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);flex-shrink:0;padding-top:3px;min-width:28px}
.clause-body{flex:1}
.clause-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.ctag{font-size:.65rem;font-weight:600;letter-spacing:.06em;padding:2px 7px;border-radius:4px;text-transform:uppercase;color:white}
.ctag.prior-urgente,.prior-urgente{background:var(--red);color:white}
.ctag.prior-alta,.prior-alta{background:var(--gold);color:white}
.ctag.prior-media,.prior-media{background:var(--green);color:white}
.ctag.st-proposta,.st-proposta{background:#9ca3af;color:white}
.ctag.st-revisao,.st-revisao{background:var(--gold);color:white}
.ctag.st-aprovada,.st-aprovada{background:var(--green);color:white}
.ctag.st-vetada,.st-vetada{background:var(--red);color:white}
.clause-text{font-size:.88rem;line-height:1.7;color:#374151;text-align:justify}
.doc-sigs{display:flex;flex-direction:column;gap:8px}
.doc-sig-item{padding:10px 14px;background:var(--green-l);border-radius:9px;border-left:3px solid var(--green)}
.sig-org{font-weight:600;font-size:.88rem}
.sig-meta{font-size:.75rem;color:var(--muted);margin-top:2px}
.doc-footer{border-top:1px solid var(--border);padding-top:22px;margin-top:28px;text-align:center}
.doc-foot-text{font-family:var(--font-display);font-size:1rem;color:var(--text);margin-bottom:4px}
.doc-foot-sub{font-size:.78rem;color:var(--muted);margin-bottom:16px}
.btn-print{background:var(--green);color:white;border:none;border-radius:10px;padding:10px 22px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:var(--font-body)}

/* ── EIXOS / CLÁUSULAS ── */
.eixo-bloco{background:white;border-radius:16px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.06);overflow:hidden}
.eixo-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer;transition:background .15s;border-left:6px solid var(--ec)}
.eixo-header:hover{background:var(--light)}
.eh-left{display:flex;align-items:center;gap:12px}
.eh-icon{font-size:1.4rem}
.eh-titulo{font-weight:700;font-size:.95rem}
.eh-sub{font-size:.78rem;color:var(--muted);margin-top:2px}
.eh-right{display:flex;align-items:center;gap:10px}
.tag-urg{background:#fee2e2;color:var(--red);font-size:.7rem;font-weight:600;padding:3px 8px;border-radius:20px}
.eh-cnt{font-family:var(--font-mono);font-size:.85rem;font-weight:700}
.eh-tog{font-size:.85rem;color:var(--muted)}
.eixo-corpo{padding:0 0 12px}
.clausula-card{margin:8px 12px;background:#fafafa;border-radius:12px;border:1.5px solid var(--border);padding:14px;transition:all .2s}
.clausula-card:hover{border-color:#d1d5db;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.clausula-card.aprovada{border-color:#86efac;background:#f0fdf4}
.clausula-card.vetada{border-color:#fca5a5;background:#fef2f2;opacity:.75}
.cc-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.cc-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-family:var(--font-mono);font-size:.7rem;font-weight:700;flex-shrink:0}
.cc-tags{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.cc-status .st-sel{border:1.5px solid var(--border);border-radius:7px;padding:4px 6px;font-size:.75rem;font-family:var(--font-body);background:white;cursor:pointer;outline:none}
.st-badge{font-size:.72rem;font-weight:600;padding:3px 8px;border-radius:6px}
.cc-actions{display:flex;gap:4px;margin-left:auto}
.cc-btn{border:none;background:none;cursor:pointer;font-size:.95rem;padding:3px 5px;border-radius:6px;transition:background .15s}
.cc-btn:hover{background:var(--light)}
.cc-btn.del:hover{background:#fee2e2}
.cc-texto{font-size:.88rem;line-height:1.75;color:#374151;text-align:justify}
.cc-props-badge{margin-top:8px;font-size:.75rem;color:var(--gold);font-weight:500}
.add-clausula-row{padding:6px 12px}
.btn-add-clausula{background:var(--green-l);color:var(--green);border:1.5px dashed var(--green);border-radius:10px;padding:9px 16px;font-size:.82rem;font-weight:600;cursor:pointer;font-family:var(--font-body);width:100%;transition:all .15s}
.btn-add-clausula:hover{background:var(--green);color:white}

/* ── SIGNATÁRIOS ── */
.sig-section-title{font-size:.85rem;font-weight:600;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.sig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:16px}
.sig-card{background:white;border-radius:14px;padding:16px;border-top:4px solid var(--sc,#1a6b2e);box-shadow:0 1px 5px rgba(0,0,0,.06)}
.sc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:5px}
.sc-nome{font-weight:600;font-size:.88rem;line-height:1.4}
.sc-status{font-size:.65rem;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:4px;color:white;text-transform:uppercase;flex-shrink:0}
.sc-tipo{font-size:.78rem;color:var(--muted);margin-bottom:4px}
.sc-meta{font-size:.75rem;color:var(--muted)}
.sc-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.sc-btn{border:1.5px solid var(--border);background:white;color:var(--muted);border-radius:7px;padding:4px 10px;font-size:.75rem;cursor:pointer;font-family:var(--font-body);transition:all .15s}
.sc-btn:hover{background:var(--light);color:var(--text)}
.sc-btn.green{border-color:var(--green);color:var(--green)}.sc-btn.green:hover{background:var(--green);color:white}
.sc-btn.red{border-color:var(--red);color:var(--red)}.sc-btn.red:hover{background:#fee2e2}
.sig-tipos-ref{background:white;border-radius:16px;padding:20px 24px;margin-top:24px;border:1.5px solid var(--border)}
.sig-ref-title{font-weight:600;font-size:.85rem;margin-bottom:12px}
.sig-ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.sig-ref-item{font-size:.8rem;color:var(--muted);padding:7px 10px;background:var(--light);border-radius:8px;line-height:1.4}
.empty-state{text-align:center;padding:32px;color:var(--muted);font-style:italic;font-size:.9rem;background:var(--light);border-radius:12px}

/* ── PROPOSTAS ── */
.prop-card{background:white;border-radius:14px;padding:16px 20px;margin-bottom:10px;box-shadow:0 1px 5px rgba(0,0,0,.06);border:1.5px solid var(--border)}
.prop-card.aberta{border-left:5px solid var(--gold)}
.prop-card.aceita{border-left:5px solid var(--green);opacity:.8}
.prop-card.rejeitada{border-left:5px solid #9ca3af;opacity:.7}
.prop-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.prop-meta{display:flex;align-items:center;gap:10px}
.prop-user{font-weight:600;font-size:.82rem;color:var(--green)}
.prop-ts{font-size:.72rem;color:var(--muted)}
.prop-ref{font-size:.72rem;background:var(--light);padding:2px 7px;border-radius:4px;color:var(--muted)}
.prop-status-tag{font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.06em;text-transform:uppercase}
.prop-status-tag.aberta{background:#fef3c7;color:#854d0e}
.prop-status-tag.aceita{background:var(--green-l);color:var(--green)}
.prop-status-tag.rejeitada{background:#f3f4f6;color:#6b7280}
.prop-original{font-size:.78rem;color:var(--muted);margin-bottom:6px;padding:7px 10px;background:var(--light);border-radius:7px;line-height:1.5}
.prop-texto{font-size:.88rem;line-height:1.7;color:var(--text);margin-bottom:10px}
.prop-actions{display:flex;gap:8px}
.prop-btn{border:none;border-radius:8px;padding:7px 14px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:var(--font-body);transition:all .15s}
.prop-btn.accept{background:var(--green);color:white}.prop-btn.accept:hover{background:#145524}
.prop-btn.reject{background:#fee2e2;color:var(--red)}.prop-btn.reject:hover{background:var(--red);color:white}

/* ── ADMIN ── */
.admin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.admin-section{background:white;border-radius:16px;padding:20px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.admin-sec-title{font-family:var(--font-mono);font-size:.7rem;font-weight:700;letter-spacing:.1em;color:var(--green);text-transform:uppercase;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--green-l)}
.admin-stats{font-size:.82rem;color:var(--muted);margin-bottom:10px}
.admin-btn{display:block;width:100%;background:var(--light);border:1.5px solid var(--border);color:var(--text);border-radius:9px;padding:9px 12px;font-size:.8rem;font-weight:500;cursor:pointer;font-family:var(--font-body);text-align:left;margin-bottom:6px;transition:all .15s}
.admin-btn:hover{background:#e5e7eb;border-color:#d1d5db}
.admin-btn.warn{background:#fef3c7;border-color:#fde68a;color:#854d0e}
.admin-btn.warn:hover{background:#fde68a}

/* ── LOG ── */
.log-item{background:white;border-radius:10px;padding:11px 14px;margin-bottom:7px;box-shadow:0 1px 4px rgba(0,0,0,.05);border-left:3px solid var(--green)}
.log-meta{display:flex;gap:8px;align-items:center;margin-bottom:3px}
.log-user{font-size:.72rem;font-weight:700;color:var(--green)}
.log-ts{font-size:.67rem;color:var(--muted)}
.log-acao{font-size:.84rem;font-weight:500;color:var(--text)}
.log-det{font-size:.76rem;color:var(--muted);margin-top:2px;padding-left:8px;border-left:2px solid var(--border);line-height:1.5}

/* ── TOAST ── */
.toast{position:fixed;bottom:22px;right:22px;background:#111827;color:white;padding:10px 18px;border-radius:10px;font-size:.82rem;font-weight:500;opacity:0;transform:translateY(8px);transition:all .25s;z-index:999;pointer-events:none;font-family:var(--font-body)}
.toast.show{opacity:1;transform:translateY(0)}
.toast.warn{background:#854d0e}
.toast.err{background:#991b1b}

/* ── PRINT ── */
@media print{
  .top-nav,.btn-print,.cc-actions,.sc-actions,.prop-actions,.btn-primary,.btn-outline,.btn-edit-inst,.admin-btn{display:none!important}
  .main-content{padding:0}
  .doc-card{box-shadow:none;border:1px solid #ccc;page-break-inside:avoid}
}

@media(max-width:700px){
  .top-nav{padding:0 12px;gap:8px}
  .nav-links{display:none}
  .main-content{padding:16px 12px 60px}
  .home-hero{padding:28px 20px}
  .doc-card{padding:24px 16px}
  .kpi-grid{grid-template-columns:repeat(3,1fr)}
  .tipos-grid,.sig-grid,.admin-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
</body>
</html>

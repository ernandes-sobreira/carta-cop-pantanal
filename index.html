async function fbLoad(){
  try{
    const s=await get(ref(db,BASE));
    if(s.exists()){const d=s.val();ST.eixos=d.eixos||JSON.parse(JSON.stringify(IE));ST.actions=d.actions||{};ST.comments=d.comments||{};ST.ticks=d.ticks||{};ST.log=d.log||[];}
    else{ST.eixos=JSON.parse(JSON.stringify(IE));await fbSave();}
    pill("Firebase conectado","ok");
  }catch(e){ST.eixos=JSON.parse(JSON.stringify(IE));pill("Modo local","warn");}
}
async function fbSave(){
  try{await set(ref(db,BASE),ST);pill("Salvo "+new Date().toLocaleTimeString('pt-BR'),"ok");}
  catch(e){pill("Erro ao salvar","err");}
}
function addLog(a,d){ST.log.unshift({ts:new Date().toISOString(),user:USER,acao:a,detalhe:d});if(ST.log.length>400)ST.log=ST.log.slice(0,400);}
function pill(m,t){const e=document.getElementById('pill');if(e){e.textContent=m;e.className='pill '+t;}}
function toast(m,t='ok'){const e=document.getElementById('toast');e.textContent=m;e.className='toast show'+(t!=='ok'?' '+t:'');setTimeout(()=>e.className='toast',2800);}
function fmt(iso){if(!iso)return'';return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
function initAction(did){if(!ST.actions[did])ST.actions[did]={acao:'',data:'',responsavel:'',grupo:'',status:'Proposta',notas:''};}

function render(){
  const r=document.getElementById('app');
  if(!USER){renderLogin(r);return;}
  const v=window._V||'carta';
  if(v==='carta')renderCarta(r);
  else if(v==='carta-texto')renderTexto(r);
  else if(v==='hist')renderHist(r);
  else renderLog(r);
}

  </div>
  <div class="hdr-r">
    <div class="hdr-user"><span class="hdr-av" style="background:${bg}">${av}</span><span>${USER.split(' ')[0]}</span></div>

  <a class="nav-a ${cur==='carta'?'on':''}" href="#" onclick="setV('carta')">&#128196; Eixos e Demandas</a>

  </div>
</nav>`;
}

function renderCarta(r){
  const total=ST.eixos.reduce((a,e)=>a+e.demandas.length,0);
  const done=ST.eixos.reduce((a,e)=>a+e.demandas.filter(d=>ST.ticks[d.id]).length,0);
  const pct=total>0?Math.round(done/total*100):0;
  const activos=Object.keys(ST.actions).filter(k=>ST.actions[k]&&ST.actions[k].acao).length;
  r.innerHTML=nav('carta')+`<div class="main">

  <div class="hero-strip">
    <div class="hero-strip-l">
      <div class="hero-strip-title">Grupo de Acao da Carta do Pantanal</div>
      <div class="hero-strip-sub">Analise coletiva, propostas e monitoramento das demandas — de 2025 ate a COP 30</div>
    </div>
    <div class="hero-kpis">
      <div class="kpi"><span class="kpi-n">${pct}%</span><span class="kpi-l">Trabalhados</span></div>
      <div class="kpi"><span class="kpi-n">${done}/${total}</span><span class="kpi-l">Itens</span></div>
      <div class="kpi"><span class="kpi-n">${activos}</span><span class="kpi-l">Com acao</span></div>
      <div class="kpi"><span class="kpi-n">${Object.values(ST.comments).reduce((a,c)=>a+c.length,0)}</span><span class="kpi-l">Manifestacoes</span></div>
    </div>
  </div>

  <div class="prog-bar-row">
    <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
  </div>

  ${ST.eixos.map(e=>renderEixo(e)).join('')}
  <div class="add-eixo-wrap"><button class="btn-add-eixo" onclick="window.addEixo()">+ Adicionar novo eixo a Carta</button></div>
  </div>`;
  pill("Firebase ativo","ok");
}

function renderEixo(e){
  const done=e.demandas.filter(d=>ST.ticks[d.id]).length;
  const tot=e.demandas.length;
  const pct=tot>0?Math.round(done/tot*100):0;
  const ncoms=e.demandas.reduce((a,d)=>a+(ST.comments[d.id]?ST.comments[d.id].length:0),0);
  const nact=e.demandas.filter(d=>ST.actions[d.id]&&ST.actions[d.id].acao).length;
  return`<div class="eixo" id="eixo_${e.id}">
  <div class="eixo-hd" onclick="togE('${e.id}')" style="--ec:${e.cor}">
    <div class="eixo-hd-l">
      <span class="eixo-dot" style="background:${e.cor}"></span>
      <div>
        <div class="eixo-tit">${e.titulo}</div>
        <div class="eixo-sub">${e.sub}</div>
      </div>
    </div>
    <div class="eixo-hd-r">
      ${nact>0?`<span class="tag-act">&#128161; ${nact} acoes</span>`:''}
      ${ncoms>0?`<span class="tag-com">&#128172; ${ncoms}</span>`:''}
      <div class="mini-prog" title="${pct}%">
        <div class="mini-prog-fill" style="width:${pct}%;background:${e.cor}"></div>
      </div>
      <span class="eixo-pct" style="color:${e.cor}">${pct}%</span>
      <span class="eixo-cnt">${done}/${tot}</span>
      <span class="tog-icon" id="ti_${e.id}">&#9660;</span>
    </div>
  </div>
  <div class="eixo-body" id="eb_${e.id}" style="display:none">
    <div class="eixo-desc-strip" style="border-left:4px solid ${e.cor}">${e.descricao}</div>
    ${e.demandas.map(d=>renderD(d,e.cor)).join('')}
    <div class="add-d-row">
      <input id="nd_${e.id}" class="nd-inp" placeholder="Adicionar nova demanda ou proposta...">
      <button class="btn-add-d" style="background:${e.cor}" onclick="window.addD('${e.id}')">+ Adicionar</button>
    </div>
    <div class="eixo-foot">
      <button class="btn-eiedit" onclick="window.editE('${e.id}')">&#9998; Editar eixo</button>
      <button class="btn-eidel" onclick="window.delE('${e.id}')">&#128465; Remover eixo</button>
    </div>
  </div>
</div>`;
}

function renderD(d,cor){
  const ck=!!ST.ticks[d.id];
  const coms=ST.comments[d.id]||[];
  const act=ST.actions[d.id]||{};
  const expC=window._expC&&window._expC[d.id];
  const expA=window._expA&&window._expA[d.id];
  const hasAct=!!act.acao;
  const stColor={"Proposta":"#888","Em andamento":"#0d5c8f","Concluida":"#1a6b2e","Pausada":"#d4890a","Cancelada":"#c0392b"};
  return`<div class="dem ${ck?'dem-done-wrap':''}" id="dem_${d.id}">
  <div class="dem-main">
    <label class="dem-chk-l"><input type="checkbox" ${ck?'checked':''} onchange="window.togTick('${d.id}')"><span class="dem-ck" style="${ck?'background:'+cor+';border-color:'+cor:''}">&#10003;</span></label>
    <div class="dem-n" style="color:${cor}">${d.n||''}</div>
    <div class="dem-txt ${ck?'dem-txt-done':''}">${d.texto}</div>
    <div class="dem-actions">
      <button class="da-btn ${hasAct?'da-on':''}" onclick="window.togA('${d.id}')" title="Plano de acao">&#128161; ${hasAct?'<span style=color:#1a6b2e;font-size:.65rem>'+act.status+'</span>':'Acao'}</button>
      <button class="da-btn ${coms.length>0?'da-on':''}" onclick="window.togC('${d.id}')" title="Manifestacoes">&#128172; ${coms.length>0?coms.length:''}</button>
      <button class="da-btn" onclick="window.editD('${d.id}')" title="Editar">&#9998;</button>
      <button class="da-btn da-del" onclick="window.delD('${d.id}')" title="Remover">&#215;</button>
    </div>
  </div>
  ${expA?renderAction(d.id,cor):''}
  ${expC?renderComs(d.id,cor):''}
</div>`;
}

        <option value="A definir" ${a.responsavel==='A definir'?'selected':''}>A definir</option>

      <label>Grupo-alvo</label>

function renderComs(did,cor){
  const coms=ST.comments[did]||[];
  return`<div class="coms-panel">

    <div class="com-meta">
      <span class="com-user">${c.user}</span>
      <span class="com-ts">${fmt(c.ts)}</span>
      ${c.user===USER?`<button class="com-del" onclick="window.delCom('${did}',${i})">&#215;</button>`:''}
    </div>
    <div class="com-txt">${c.texto}</div>
  </div>`).join('')}

    <textarea id="ci_${did}" class="com-ta" rows="2" placeholder="Sua manifestacao, analise ou proposta sobre esta demanda..."></textarea>
    <button class="com-send" style="background:${cor}" onclick="window.addCom('${did}')">Enviar</button>
  </div>
</div>`;
}

    </div>

      "O Pantanal, coracao umido da America do Sul, fala — nossas aguas gritam por esperanca."

    <div class="carta-section">
      <h2>Preambulo</h2>
      <p>O Pantanal, coracao umido da America do Sul, fala. Esta Carta nasce do encontro de mais de 500 vozes diversas, entre comunidades tradicionais, povos indigenas, quilombolas, ribeirinhos, pesquisadores, gestores publicos, educadores, empresas privadas e movimentos sociais, que se unem para defender a vida, a agua e a dignidade de quem habita esse territorio.</p>
      <p>Inspirados pela Agenda 2030 e pelos Objetivos do Desenvolvimento Sustentavel, afirmamos que a crise climatica e tambem uma crise etica, social e ecologica. No Pantanal, a irregularidade das cheias, as queimadas cada vez mais severas, o desmatamento e o avanco desordenado da agropecuaria revelam a ruptura de um equilibrio milenar entre ser humano e natureza. A degradacao dos ecossistemas vem acompanhada da fragilizacao das politicas publicas, da perda de saberes tradicionais e da desigualdade no acesso a terra e a agua.</p>
      <p>Mas queremos que a nossa voz ecoe tambem como um chamado a regeneracao da terra e da economia. O futuro do Pantanal e de todo o Mato Grosso, mas depende da coragem de impulsionar novos negocios e a nova economia que nascem dos residuos da natureza, transformando o que antes era descarte em fonte de renda, dignidade e inovacao.</p>
    </div>

    <div class="carta-section">
      <h2>1. Diagnostico — Forcas e Fragilidades</h2>
      <p>Suas forcas estao no vigor da biodiversidade, na sabedoria dos povos que aprenderam a viver com o pulso das aguas, na solidariedade comunitaria e na beleza de uma paisagem que inspira o mundo. Ha forca tambem na ciencia que se aproxima da experiencia local, na cultura pantaneira que celebra a terra, o rio, o fogo e o tempo.</p>
      <p>Mas as fragilidades sao profundas e exigem respostas estruturais: a ausencia de politicas publicas integradas e de longo prazo mina a capacidade de gestao do territorio; o desmatamento e o uso insustentavel do solo comprometem nascentes e margens; a intensificacao das queimadas e incendios ameaca ecossistemas e vidas humanas; a pressao de grandes empreendimentos e monoculturas transforma paisagens em zonas de risco ambiental; a desvalorizacao das comunidades tradicionais e da juventude rural fragiliza o tecido social e o futuro da conservacao; a educacao ambiental ainda e incipiente, e a desinformacao agrava a desconexao entre sociedade e natureza.</p>
    </div>

    <div class="carta-section">
      <h2>2. Horizontes — Oportunidades para um novo pacto</h2>
      <p>O Pantanal pode e deve ser referencia global em sustentabilidade, bioeconomia e justica climatica. As oportunidades identificadas apontam para: fortalecimento da bioeconomia de base local, com cadeias produtivas que respeitem o ciclo das aguas e promovam renda sem destruir; ampliacao das politicas de restauracao ecologica e manejo sustentavel do fogo, valorizando o conhecimento tradicional; educacao ambiental critica e emancipatoria, que forme cidadaos conscientes e agentes de mudanca; ciencia cidada e integracao entre universidades, escolas e comunidades, para monitorar e compreender as transformacoes ambientais; turismo sustentavel e solidario, que gere economia e reforce o pertencimento cultural; participacao social efetiva nos Comites de Bacia Hidrografica, garantindo a gestao democratica das aguas; insercao do Pantanal nas agendas globais de clima e biodiversidade, como simbolo de cooperacao internacional pela vida.</p>
    </div>

    <div class="carta-section">
      <h2>3. Compromissos — Ciencia, Saberes e Acao</h2>
      <p>Comprometemo-nos, coletivamente, a: valorizar e proteger os povos tradicionais, reconhecendo seus direitos territoriais e seus modos de vida como expressoes de sustentabilidade; promover politicas publicas integradas de conservacao e desenvolvimento, com base em dados cientificos e dialogo social; apoiar a transicao ecologica e justa, substituindo modelos predatorios por economias regenerativas; fortalecer o protagonismo das mulheres pantaneiras, juventudes, educadores ambientais e Comites de Bacia Hidrografica como liderancas da transformacao; integrar ciencia, educacao e gestao ambiental em um projeto de futuro que una conhecimento e etica; reforcar o papel dos Comites de Bacia Hidrografica como espacos legitimos de participacao e planejamento territorial.</p>
    </div>

    <div class="carta-section">
      <h2>4. Demandas a COP 30</h2>
      <p>A luz da urgencia climatica e da Agenda 2030, demandamos:</p>
      <ol class="carta-lista">
        <li>A implementacao de politicas de mitigacao e adaptacao climatica especificas para o bioma Pantanal, com metas e indicadores publicos;</li>
        <li>A criacao de um Fundo Internacional de Restauracao e Governanca das Aguas do Pantanal, com participacao da sociedade civil e das comunidades locais;</li>
        <li>A protecao e regularizacao fundiaria dos territorios tradicionais e coletivos;</li>
        <li>A inclusao do Pantanal nas decisoes estrategicas da COP 30, com representacao dos povos locais;</li>
        <li>O fortalecimento das instituicoes ambientais, com recursos, autonomia tecnica e mecanismos de transparencia;</li>
        <li>O fortalecimento e estabelecimento com organizacoes Globais que visam impulsionar o Impacto Positivo Real;</li>
        <li>A promocao da educacao ambiental e da cultura pantaneira como pilares da sustentabilidade;</li>
        <li>A adocao de planos permanentes de prevencao e manejo do fogo, baseados na ciencia e nos saberes tradicionais;</li>
        <li>Restauracao das nascentes do Rio Paraguai, por este ser o eixo principal do Pantanal;</li>
        <li>Implantar a politica de corredores bioculturais no Pantanal, como forma de manter viva a biodiversidade e diversidade cultural;</li>
        <li>Promover o reconhecimento dos direitos da natureza e dos rios em toda a bacia do Rio Paraguai.</li>
      </ol>
    </div>

    <div class="carta-section">
      <h2>5. Chamado a Acao — O Pantanal e agora</h2>
      <p>Preservar o Pantanal e preservar a agua que nos sustenta, o ar que respiramos e a diversidade que nos alimenta. Convocamos a COP 30, e todos os espacos de decisao climatica, a reconhecer o Pantanal como zona estrategica de resiliencia global, e a garantir acoes concretas, mensuraveis e justas em sua defesa.</p>
      <p>Chamamos a sociedade brasileira e internacional a agir. O Pantanal e um espelho do planeta: o que se perde aqui ecoa em todo o mundo. O Pantanal nao e apenas um bioma, e uma licao viva de coexistencia, um patrimonio cultural material e imaterial, onde a ancestralidade de seus povos reverba o espirito da floresta, um simbolo de esperanca em tempos de crise.</p>
    </div>

    <div class="carta-assinatura">
      <h2>Enquanto houver Pantanal, havera futuro!</h2>
      <p>Enquanto houver quem acredite no poder da vida, havera Pantanal, enquanto houver Pantanal, havera humanidade.</p>
    </div>
  </div>
  </div>`;
}

window.doLogin=function(n){USER=n;addLog("Login",n);fbLoad().then(()=>render());};

window.setV=function(v){event&&event.preventDefault();window._V=v;render();};

window.togE=function(id){

  if(!b)return;const op=b.style.display!=='none';
  b.style.display=op?'none':'block';if(t)t.innerHTML=op?'&#9660;':'&#9650;';

window.togTick=async function(did){
  ST.ticks[did]=!ST.ticks[did];
  const eixo=ST.eixos.find(e=>e.demandas.find(d=>d.id===did));
  const dem=eixo&&eixo.demandas.find(d=>d.id===did);
  addLog(ST.ticks[did]?"Marcada":"Desmarcada",dem?dem.texto.slice(0,80):did);
  await fbSave();render();
  if(eixo)reopen(eixo.id,did);
};

window.togA=function(did){
  window._expA=window._expA||{};window._expA[did]=!window._expA[did];
  render();
  const eixo=ST.eixos.find(e=>e.demandas.find(d=>d.id===did));
  if(eixo)reopen(eixo.id,did);
};

window.togC=function(did){
  window._expC=window._expC||{};window._expC[did]=!window._expC[did];
  render();
  const eixo=ST.eixos.find(e=>e.demandas.find(d=>d.id===did));
  if(eixo)reopen(eixo.id,did);

window.saveAction=async function(did){
  initAction(did);
  const f=id=>document.getElementById(id);
  ST.actions[did]={
    acao:f('ap_acao_'+did)?f('ap_acao_'+did).value:'',
    status:f('ap_status_'+did)?f('ap_status_'+did).value:'Proposta',
    data:f('ap_data_'+did)?f('ap_data_'+did).value:'',
    responsavel:f('ap_resp_'+did)?f('ap_resp_'+did).value:'',
    grupo:f('ap_grupo_'+did)?f('ap_grupo_'+did).value:'',
    notas:f('ap_notas_'+did)?f('ap_notas_'+did).value:''
  };
  const eixo=ST.eixos.find(e=>e.demandas.find(d=>d.id===did));
  const dem=eixo&&eixo.demandas.find(d=>d.id===did);
  addLog("Plano de acao salvo",(dem?dem.texto.slice(0,60)+' | ':'')+ST.actions[did].acao.slice(0,60));
  await fbSave();render();
  if(eixo){window._expA=window._expA||{};window._expA[did]=true;reopen(eixo.id,did);}
  toast("Plano de acao salvo!");
};

window.clearAction=async function(did){
  if(!confirm("Limpar o plano de acao?"))return;
  ST.actions[did]={acao:'',data:'',responsavel:'',grupo:'',status:'Proposta',notas:''};
  addLog("Plano limpo",did);await fbSave();render();
  const eixo=ST.eixos.find(e=>e.demandas.find(d=>d.id===did));
  if(eixo)reopen(eixo.id,did);
};

window.addCom=async function(did){
  const inp=document.getElementById('ci_'+did);
  if(!inp||!inp.value.trim()){toast("Digite algo","warn");return;}
  if(!ST.comments[did])ST.comments[did]=[];
  const c={user:USER,ts:new Date().toISOString(),texto:inp.value.trim()};
  ST.comments[did].push(c);addLog("Manifestacao",c.texto.slice(0,80));
  await fbSave();window._expC=window._expC||{};window._expC[did]=true;render();
  const eixo=ST.eixos.find(e=>e.demandas.find(d=>d.id===did));
  if(eixo)reopen(eixo.id,did);
  toast("Manifestacao enviada!");
};

window.delCom=async function(did,i){
  if(!confirm("Remover?"))return;
  ST.comments[did].splice(i,1);addLog("Manifestacao removida","item "+i);
  await fbSave();window._expC=window._expC||{};window._expC[did]=true;render();
  const eixo=ST.eixos.find(e=>e.demandas.find(d=>d.id===did));
  if(eixo)reopen(eixo.id,did);
};

window.editD=function(did){
  const eixo=ST.eixos.find(e=>e.demandas.find(d=>d.id===did));if(!eixo)return;
  const dem=eixo.demandas.find(d=>d.id===did);
  const nt=prompt("Editar demanda:",dem.texto);

window.delD=async function(did){
  if(!confirm("Remover esta demanda?"))return;
  const eixo=ST.eixos.find(e=>e.demandas.find(d=>d.id===did));if(!eixo)return;
  const dem=eixo.demandas.find(d=>d.id===did);
  addLog("Demanda removida",dem.texto.slice(0,60));
  eixo.demandas=eixo.demandas.filter(d=>d.id!==did);delete ST.ticks[did];delete ST.comments[did];delete ST.actions[did];

};

window.addD=async function(eid){
  const inp=document.getElementById('nd_'+eid);if(!inp||!inp.value.trim()){toast("Digite o texto","warn");return;}
  const eixo=ST.eixos.find(e=>e.id===eid);if(!eixo)return;
  const id='cx_'+Date.now();
  eixo.demandas.push({id,n:'',texto:inp.value.trim()});
  addLog("Nova demanda",inp.value.trim().slice(0,80));
  await fbSave();render();reopen(eid);toast("Demanda adicionada!");
};

window.editE=function(eid){
  const e=ST.eixos.find(x=>x.id===eid);if(!e)return;
  const nt=prompt("Titulo:",e.titulo);if(!nt||!nt.trim())return;
  const nd=prompt("Descricao:",e.descricao);
  addLog("Eixo editado",e.titulo+" > "+nt);e.titulo=nt.trim();if(nd)e.descricao=nd.trim();
  fbSave().then(()=>{render();reopen(eid);});toast("Eixo atualizado");
};

window.delE=async function(eid){
  if(!confirm("Remover este eixo inteiro?"))return;
  const e=ST.eixos.find(x=>x.id===eid);if(!e)return;
  addLog("Eixo removido",e.titulo);ST.eixos=ST.eixos.filter(x=>x.id!==eid);
  await fbSave();render();toast("Eixo removido");
};

window.addEixo=async function(){
  const t=prompt("Titulo do novo eixo:");if(!t||!t.trim())return;
  const d=prompt("Descricao:")||'';
  const cores=["#1a6b2e","#0d5c8f","#d4890a","#c0392b","#6c3483","#1a7a6b"];
  ST.eixos.push({id:'ex_'+Date.now(),cor:cores[ST.eixos.length%cores.length],titulo:t.trim(),sub:'',descricao:d.trim(),demandas:[]});
  addLog("Eixo criado",t);await fbSave();render();toast("Eixo criado!");
};

function reopen(eid,did){
  const b=document.getElementById('eb_'+eid);const t=document.getElementById('ti_'+eid);
  if(b){b.style.display='block';if(t)t.innerHTML='&#9650;';}
  if(did){const el=document.getElementById('dem_'+did);if(el)el.scrollIntoView({block:'nearest'});}
}

window.expJSON=function(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({ts:new Date().toISOString(),user:USER,eixos:ST.eixos,ticks:ST.ticks,actions:ST.actions,comments:ST.comments},null,2)],{type:'application/json'}));
  a.download='carta-pantanal-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  addLog("Export JSON","por "+USER);toast("JSON exportado!");
};

window.expTXT=function(){
  let t="CARTA DO PANTANAL — Grupo de Acao\nExportado em: "+new Date().toLocaleString('pt-BR')+" por "+USER+"\n"+"=".repeat(70)+"\n\n";
  ST.eixos.forEach(e=>{
    const done=e.demandas.filter(d=>ST.ticks[d.id]).length;
    t+=e.titulo+" ["+done+"/"+e.demandas.length+"]\n"+e.descricao+"\n"+"-".repeat(60)+"\n";
    e.demandas.forEach((d,i)=>{
      t+=(ST.ticks[d.id]?"[X]":"[ ]")+" "+(d.n||i+1)+". "+d.texto+"\n";
      const a=ST.actions[d.id];
      if(a&&a.acao){t+="     ACAO: "+a.acao+"\n";if(a.status)t+="     Status: "+a.status+"\n";if(a.data)t+="     Data: "+a.data+"\n";if(a.responsavel)t+="     Responsavel: "+a.responsavel+"\n";if(a.grupo)t+="     Grupo-alvo: "+a.grupo+"\n";if(a.notas)t+="     Notas: "+a.notas+"\n";}
      (ST.comments[d.id]||[]).forEach(c=>{t+="     >> "+c.user+" ("+fmt(c.ts)+"): "+c.texto+"\n";});
    });t+="\n";
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));
  a.download='carta-pantanal-'+new Date().toISOString().slice(0,10)+'.txt';a.click();
  addLog("Export TXT","por "+USER);toast("TXT exportado!");
};

/* HEADER */

/* NAV */

.nav-btn-save{background:#1a6b2e;color:#fff;border:none;border-radius:7px;padding:6px 12px;font-size:.74rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}

/* MAIN */

.kpi{background:rgba(255,255,255,.12);border-radius:10px;padding:10px 16px;text-align:center;min-width:72px}
.kpi-n{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;color:#f0c060;display:block;line-height:1}

.nd-inp{flex:1;border:1.5px solid #e5e7eb;border-radius:8px;padding:7px 10px;font-size:.8rem;font-family:inherit;outline:none;transition:border-color .15s}

/* DEMANDA */
.dem{border:1.5px solid transparent;border-radius:10px;margin:0 14px 8px;transition:all .15s;background:#f9fafb}

.dem-ck{width:17px;height:17px;border:2px solid #d1d5db;border-radius:4px;display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:.65rem;color:transparent;flex-shrink:0}

.ap-wide{grid-column:1/-1}
.ap-field{display:flex;flex-direction:column;gap:4px}

.ap-ta{border:1.5px solid #e5e7eb;border-radius:8px;padding:7px 9px;font-size:.8rem;font-family:inherit;resize:vertical;outline:none;transition:border-color .15s;background:#fff}
.ap-ta:focus{border-color:#1a6b2e}
.ap-inp{border:1.5px solid #e5e7eb;border-radius:8px;padding:7px 9px;font-size:.8rem;font-family:inherit;outline:none;transition:border-color .15s;background:#fff}
.ap-inp:focus{border-color:#1a6b2e}
.ap-sel{border:1.5px solid #e5e7eb;border-radius:8px;padding:7px 9px;font-size:.8rem;font-family:inherit;outline:none;background:#fff;cursor:pointer}

/* COMMENTS */
.coms-panel{background:#f0f7ff;border-top:1px solid #bfdbfe;padding:14px 14px 12px}
.coms-title{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#1e40af;margin-bottom:10px}
.coms-empty{font-size:.78rem;color:#9ca3af;font-style:italic;margin-bottom:10px}
.com-item{background:#fff;border-radius:8px;padding:9px 11px;margin-bottom:7px;border:1px solid #dbeafe}
.com-meta{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.com-user{font-size:.72rem;font-weight:700;color:#1e40af}
.com-ts{font-size:.67rem;color:#9ca3af}
.com-del{margin-left:auto;border:none;background:none;color:#dc2626;cursor:pointer;font-size:.82rem;padding:0 4px}
.com-txt{font-size:.82rem;line-height:1.6;color:#374151}
.com-inp-row{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.com-ta{flex:1;border:1.5px solid #bfdbfe;border-radius:8px;padding:7px 9px;font-size:.8rem;font-family:inherit;resize:vertical;outline:none;transition:border-color .15s;background:#fff}
.com-ta:focus{border-color:#3b82f6}
.com-send{border:none;color:#fff;border-radius:8px;padding:7px 12px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}

/* CARTA TEXTO */
.carta-wrap{max-width:700px;margin:0 auto;background:#fff;border-radius:16px;padding:48px 52px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.carta-header{text-align:center;margin-bottom:32px;padding-bottom:28px;border-bottom:2px solid #f0faf5}
.carta-leaf{font-size:3rem;margin-bottom:12px}
.carta-h1{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,4vw,2.6rem);font-weight:900;line-height:1.1;margin-bottom:10px}
.carta-h1 span{color:#1a6b2e}
.carta-tagline{font-family:'Fraunces',serif;font-style:italic;font-size:1rem;color:#666;line-height:1.6;margin-bottom:12px}
.carta-meta{font-size:.72rem;color:#aaa;letter-spacing:.04em}
.carta-quote{font-family:'Fraunces',serif;font-style:italic;font-size:1.08rem;line-height:1.8;color:#444;padding:18px 22px;border-left:4px solid #3aab6b;background:#f0faf5;border-radius:0 10px 10px 0;margin-bottom:26px}
.carta-section{margin-bottom:24px}
.carta-section h2{font-family:'Playfair Display',serif;font-size:1.1rem;color:#1a6b2e;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #e8f5ee}

.carta-lista{padding-left:18px;display:flex;flex-direction:column;gap:6px}
.carta-lista li{font-size:.88rem;line-height:1.7;color:#374151}
.carta-assinatura{background:linear-gradient(135deg,#0a3d1a,#1a6b2e);border-radius:14px;padding:28px;text-align:center;margin-top:28px}
.carta-assinatura h2{font-family:'Playfair Display',serif;font-size:1.4rem;color:#f0c060;margin-bottom:10px}
.carta-assinatura p{font-family:'Fraunces',serif;font-style:italic;font-size:.95rem;color:rgba(255,255,255,.8);line-height:1.7}

/* HISTORICO */
.hist-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.hist-card{background:#fff;border-radius:13px;padding:20px 18px;box-shadow:0 1px 8px rgba(0,0,0,.07);border-top:4px solid var(--hc,#1a6b2e)}
.hc-date{font-size:.67rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#9ca3af;margin-bottom:6px}
.hc-icon{font-size:1.7rem;margin-bottom:7px}
.hist-card h3{font-family:'Playfair Display',serif;font-size:.97rem;margin-bottom:7px}

.hist-card ul{list-style:none;display:flex;flex-direction:column;gap:3px}
.hist-card ul li{font-size:.76rem;color:#6b7280;padding-left:11px;position:relative;line-height:1.45}
.hist-card ul li::before{content:'·';position:absolute;left:0;color:var(--hc,#1a6b2e);font-weight:700}
.hist-nota{background:#fef9c3;border-radius:9px;padding:12px 14px;font-size:.8rem;line-height:1.6;color:#555;border-left:4px solid #f0a800}
.hist-nota strong{color:#854d0e}

/* LOG */
.pg-tit{font-family:'Playfair Display',serif;font-size:1.35rem;margin-bottom:7px}
.pg-sub{font-size:.82rem;color:#6b7280;margin-bottom:20px;line-height:1.6}
.empty-box{background:#f3f4f6;border-radius:10px;padding:20px;text-align:center;color:#9ca3af;font-size:.84rem}
.log-item{background:#fff;border-radius:9px;padding:11px 13px;margin-bottom:7px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.log-meta{display:flex;gap:8px;align-items:center;margin-bottom:3px}
.log-u{font-size:.7rem;font-weight:700;color:#1a6b2e}
.log-t{font-size:.66rem;color:#9ca3af}
.log-a{font-size:.82rem;font-weight:500;color:#374151}
.log-d{font-size:.76rem;color:#9ca3af;margin-top:2px;padding-left:8px;border-left:2px solid #e5e7eb;line-height:1.5}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:#111827;color:#fff;padding:9px 16px;border-radius:9px;font-size:.8rem;font-weight:500;opacity:0;transform:translateY(8px);transition:all .25s;z-index:999;pointer-events:none;font-family:inherit}
.toast.show{opacity:1;transform:translateY(0)}
.toast.warn{background:#854d0e}
.toast.err{background:#991b1b}

@media(max-width:620px){
  .hist-grid{grid-template-columns:1fr}
  .ap-grid{grid-template-columns:1fr}
  .ap-wide{grid-column:1}
  .carta-wrap{padding:28px 20px}
  .hdr-sub,.pill{display:none}
  .main{padding:14px 10px 60px}
  .hero-kpis{gap:8px}
  .kpi{padding:8px 12px;min-width:60px}
}
</style>
